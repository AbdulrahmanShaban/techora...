, "why": "التخزين مرحلة أساسية."}, {"q": "عملية استخلاص المعلومات تتم قبل تحليل البيانات.", "c": false, "why": "الاستخلاص بعد التحليل."}, {"q": "التعلم الآلي والعميق ليسا في حاجة إلى بيانات ضخمة.", "c": false, "why": "كلما زادت البيانات زادت الدقة."}, {"q": "تُستخدم البيانات الضخمة في مراقبة الشبكات والأمن السيبراني.", "c": true, "why": "لاكتشاف التهديدات."}, {"q": "منصات التجارة الإلكترونية تعتمد على البيانات الضخمة لفهم سلوك العملاء.", "c": true, "why": "لتحسين التوصيات والمبيعات."}, {"q": "لا تتطلب الرؤية الحاسوبية مجموعات ضخمة من الصور.", "c": false, "why": "تعتمد عليها لتدريب النماذج."}, {"q": "التحليلات التنبؤية والرؤية الحاسوبية من تطبيقات الذكاء الاصطناعي المتقدمة.", "c": true, "why": "صحيح."}, {"q": "البيانات الضخمة ليست المادة الخام التي يتغذى عليها الذكاء الاصطناعي.", "c": false, "why": "هي مادته الخام."}, {"q": "بدون البيانات الضخمة يصبح الذكاء الاصطناعي مجرد خوارزميات نظرية.", "c": true, "why": "لا يتعلم ولا يقدم قيمة حقيقية."}]}, {"type": "mcq", "title": "المستوى 3 • فكّر واختر", "items": [{"q": "ماذا يعني تنظيف البيانات؟", "a": ["التعامل مع الأخطاء والتكرار والبيانات غير الصحيحة", "حذف كل البيانات", "تخزينها في السحابة", "نسخها دون تعديل"], "c": 0, "why": "نتأكد أنها صحيحة قبل التحليل."}, {"q": "متجر إلكتروني يقترح عليك منتجات تناسب ذوقك. على ماذا يعتمد؟", "a": ["تحليل بيانات سلوك العملاء الضخمة", "الحظ العشوائي", "لون الموقع", "عدد الموظفين"], "c": 0, "why": "التجارة الإلكترونية تعتمد على البيانات الضخمة."}, {"q": "نموذج لغوي مثل GPT يحتاج لتعلم اللغة إلى:", "a": ["بيانات نصية ضخمة جدًا", "صور فقط", "أرقام فقط", "لا شيء"], "c": 0, "why": "NLP يعتمد على نصوص ضخمة."}, {"q": "التعرف على الوجوه يعتمد على:", "a": ["مجموعات ضخمة من الصور والفيديوهات", "نصوص قصيرة", "جداول إكسل صغيرة", "أصوات فقط"], "c": 0, "why": "الرؤية الحاسوبية."}, {"q": "تحليل السجلات الطبية الضخمة لتشخيص الأمراض مثال على:", "a": ["اكتشاف الرؤى والأنماط المخفية", "الأتمتة فقط", "التخزين فقط", "الإعلانات"], "c": 0, "why": "أنماط يصعب على الأدوات التقليدية كشفها."}, {"q": "ما هي المشكلة التي يقلّلها تدريب النماذج على بيانات متنوعة؟", "a": ["التجهيز الزائد Overfitting", "سرعة الإنترنت", "حجم الشاشة", "عدد الملفات"], "c": 0, "why": "تعميم أفضل ودقة أعلى."}]}, {"type": "match", "title": "المستوى 4 • اربط الاستخدام بدوره", "q": "اربط كل استخدام بما يناسبه", "rounds": [[["التجارة الإلكترونية", "فهم سلوك العملاء وتحسين التوصيات"], ["الأمن السيبراني", "مراقبة الشبكة لاكتشاف التهديدات"], ["التعلم الآلي", "التنبؤ بالأحداث مثل الطقس"], ["الرؤية الحاسوبية", "التعرف على الوجوه والأشياء"], ["معالجة اللغة", "فهم اللغة البشرية وتوليدها"]]]}, {"type": "mcq", "title": "المستوى 5 • 🔥 تحدي الخبراء", "n": 8, "items": [{"q": "عبارة \"Garbage In, Garbage Out\" تعني:", "a": ["البيانات الرديئة تعطي نتائج رديئة مهما كانت الخوارزمية", "أن القمامة تنتج الطاقة", "أن التخزين مجاني", "أن التحليل لا يحتاج بيانات"], "c": 0, "why": "جودة المدخلات تحدد جودة المخرجات."}, {"q": "شركة حلّلت بياناتها دون تنظيف وظهر تكرار عملاء كثير. التأثير الأرجح؟", "a": ["نتائج مضللة وتنبؤات أقل دقة", "زيادة دقة التحليل", "لا تأثير", "تسريع المعالجة دائمًا"], "c": 0, "why": "التكرار يشوه الإحصاءات."}, {"q": "نموذج دقته ممتازة على بيانات تدريبه وضعيفة على بيانات جديدة. المشكلة؟", "a": ["التجهيز الزائد Overfitting", "نقص الكهرباء", "بطء الإنترنت", "كبر الشاشة"], "c": 0, "why": "لم يعمم لأنه حفظ بيانات التدريب."}, {"q": "أي إجراء يقلل مشكلة Overfitting؟", "a": ["تدريب النموذج على بيانات أكبر وأكثر تنوعًا", "تقليل البيانات", "تكرار نفس البيانات", "حذف الاختبار"], "c": 0, "why": "التنوع يحسن التعميم."}, {"q": "مستشفى يحلل سجلات طبية ضخمة لاكتشاف أنماط مبكرة لمرض. أي دور هذا؟", "a": ["اكتشاف الرؤى والأنماط المخفية", "الأتمتة فقط", "تخزين فقط", "تسويق"], "c": 0, "why": "أنماط يصعب كشفها بالأدوات التقليدية."}, {"q": "ما المرحلة التي تأتي بعد تخزين البيانات وقبل تحليلها؟", "a": ["تنظيف البيانات", "استخلاص المعلومات", "تجميع البيانات", "نشر البيانات"], "c": 0, "why": "تنظف قبل التحليل لضمان الصحة."}, {"q": "توقع مبيعات الشهر القادم من سجلات المبيعات السابقة مثال على:", "a": ["التحليلات التنبؤية", "الرؤية الحاسوبية", "معالجة الصور فقط", "التخزين السحابي"], "c": 0, "why": "التنبؤ من بيانات تاريخية."}, {"q": "أي خطر أخلاقي مرتبط باستخدام البيانات الضخمة في الذكاء الاصطناعي؟", "a": ["انتهاك الخصوصية أو انحياز النتائج", "سرعة الحاسوب", "لون الشاشة", "حجم الملفات فقط"], "c": 0, "why": "يجب الحذر في الجمع والتدريب."}]}, {"type": "tf", "title": "المستوى 6 • 🔥 صح أم خطأ للخبراء", "items": [{"q": "زيادة كمية البيانات وحدها تضمن دقة أفضل حتى لو كانت رديئة.", "c": false, "why": "الجودة مهمة كالحجم."}, {"q": "يمكن تخزين البيانات الضخمة في أنظمة سحابية.", "c": true, "why": "من خيارات التخزين."}, {"q": "يمكن للذكاء الاصطناعي تخطي مرحلة تنظيف البيانات دون أي تأثير.", "c": false, "why": "البيانات الرديئة تضر بالنتائج."}, {"q": "تدفق البيانات في الوقت الفعلي يساعد النماذج على التعلم والتكيف المستمر.", "c": true, "why": "من أدوار البيانات الضخمة."}, {"q": "البيانات الضخمة والذكاء الاصطناعي علاقتهما في اتجاه واحد فقط.", "c": false, "why": "علاقة تبادلية."}]}], "mount": "#game", "avatar": "../../../assets/teacher/g2-u1l4.jpg", "avatarFallback": "../../../assets/teacher/base.jpg"})</script></body></html>
