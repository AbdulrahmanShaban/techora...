<!doctype html><html lang="ar" dir="rtl"><head><script src="../../../assets/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأنظمة الذكية وتأثيرها على التغيرات المناخية | Techora</title><link rel="icon" href="../../../assets/logo.svg"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../../../firebase-config.js"></script><script src="../../../auth-core.js"></script><script src="../../../techora-config.js"></script><script src="../../../assets/data.js"></script><script src="../../../auth-guard.js" data-root="../../../"></script><link rel="stylesheet" href="../../../assets/lesson.css"></head><body><div class="top"><a href="../../../grade-2/term-1.html">→ دروس الفصل الأول</a><span class="t">الدرس الأول • المحتوى</span><a href="../../../index.html">Techora ⌂</a></div><main class="wrap" id="app"></main><script src="../../../assets/lesson.js"></script><script>TLesson.render({"title": "الأنظمة الذكية وتأثيرها على التغيرات المناخية", "pages": "ص ٦ – ٢٢", "intro": "إزاي إنترنت الأشياء والذكاء الاصطناعي والروبوتات لما يشتغلوا مع بعض يساعدوا في حماية كوكبنا؟", "goals": ["أشرح مفهوم الأنظمة الذكية المترابطة (إنترنت الأشياء، الذكاء الاصطناعي والروبوتات).", "أستنتج تأثير الأنظمة الذكية المترابطة في مواجهة المشكلات البيئية (تلوث الهواء والجفاف...).", "أقترح أكبر عدد من الأفكار لتوظيف الأنظمة الذكية في حماية البيئة وتقليل آثار التغيرات المناخية."], "summary": "الأنظمة الذكية المترابطة = <b>IoT</b> (يجمع ويرسل) + <b>AI</b> (يحلّل ويقرر) + <b>الروبوتات</b> (تنفّذ). بتساعدنا نراقب البيئة ونقلل التلوث ونوفّر المياه والطاقة، لكن لازم نوازن بين فوائدها وتحدياتها (التكلفة، الصيانة، الاعتماد على الإنترنت، الخصوصية، والجانب الإنساني).", "sections": [{"type": "act", "k": "🗣️ لنتفاعل معًا", "t": "ما الأنظمة الذكية المترابطة؟ وكيف يمكن أن تساهم في حماية كوكبنا؟", "gold": false}, {"type": "text", "h": "تذكّر ما درسته", "t": "عرفنا قبل كده <b>إنترنت الأشياء IoT</b> (ربط الأجهزة بالإنترنت لتتبادل البيانات)، و<b>الذكاء الاصطناعي AI</b> (قدرة الآلة على التفكير واتخاذ القرار مثل الإنسان)، و<b>الروبوتات Robotics</b> (أجهزة تؤدي أعمالًا تشبه ما يقوم به الإنسان). النهارده هنشوف إزاي بيشتغلوا <b>مع بعض</b>."}, {"type": "cards", "h": "١) فكرة عمل الأنظمة الذكية المترابطة", "l": "تخيّل روبوت ذكي ينظف بيتك، يتحرك بنفسه، يتجنب العوائق، ويشحن نفسه لما بطاريته تفرغ. ده بيعتمد على:", "items": [["🌐", "IoT للاتصال", "يربط الجهاز بالإنترنت وأجهزة الاستشعار."], ["🧠", "AI للتحليل والقرار", "يحلل المعلومات ويقرر."], ["🤖", "Robotics للحركة", "يتحرك وينفّذ المهام."]]}, {"type": "text", "t": "لما تشتغل التقنيات التلاتة معًا نحصل على <b>الأنظمة الذكية المترابطة (Smart Connected Systems)</b>: أنظمة بتتصل ببعضها، وتفكر، وتنفّذ المهام <b>بدون تدخل بشري دائم</b>. وفي المنزل الذكي مثلًا: IoT يتحكم في الإضاءة والحرارة، وAI يلاحظ إنك بترجع من المدرسة الساعة 2 فيشغّل التكييف قبل وصولك، والروبوت يجهّز الأكل أو ينظف الأرضية."}, {"type": "steps", "h": "٢) مثال: عطل سيارة والدك على الطريق", "l": "شوف التقنيات بتتقاسم الشغل إزاي:", "items": [["IoT", "حساسات السيارة تكتشف العطل وترسل رسالة تلقائيًا لمركز الصيانة أو تطبيق على هاتفك، وتحدد موقعك بالـGPS: \"عطل في المحرك – طريق القاهرة السويس – الكيلو 57\"."], ["AI", "يحلل بيانات العطل ويقترح السبب المحتمل (ارتفاع حرارة المحرك أو نقص الزيت…) ثم يقترح الحل: \"أوقف السيارة فورًا – سيتم إرسال روبوت صيانة\"."], ["الروبوت", "يتوجه لمكان السيارة، يفحصها، يفتح غطاء المحرك ويبدّل القطعة التالفة، ثم يخبرك: \"يمكنك المتابعة بأمان\". ولو لم يستطع الإصلاح يطلب سيارة نقل تلقائيًا."]]}, {"type": "table", "head": ["المكوّن", "وظيفته", "في مثال السيارة", "لو غاب؟"], "rows": [["IoT", "إرسال المعلومات وتحديد الموقع", "يبلّغ عن العطل والموقع", "لن يعرف أحد بالعطل"], ["AI", "تحليل المشكلة واتخاذ القرار", "يحدد السبب والحل", "بيانات كثيرة بلا قرار"], ["Robotics", "تنفيذ الإصلاح أو المساعدة الميدانية", "يصلح العطل البسيط", "قرار بلا تنفيذ"]]}, {"type": "acc", "h": "٣) تطبيقات عملية في حياتنا", "l": "اضغط على كل تطبيق لتعرف دور كل تقنية فيه، مع المثال.", "items": [["🏠 المنزل الذكي", "<div class=\"tri\"><div><b>IoT:</b> يربط الإضاءة والتكييف والأجهزة بالهاتف أو الإنترنت</div><div><b>AI:</b> يفهم الحالة، فإذا كان الجو حارًّا يشغّل التكييف تلقائيًا</div><div><b>الروبوتات:</b> قد تساعد في المهام كتشغيل المكنسة أو تحريك الأشياء</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: تقول للهاتف \"شغّل التكييف\" فيُرسل الأمر عبر الإنترنت ويحدد الجهاز أفضل درجة حرارة.</div>"], ["🏫 الروبوت في المدرسة", "<div class=\"tri\"><div><b>IoT:</b> يجعل الروبوت متصلًا بالمصادر التعليمية عبر الإنترنت</div><div><b>AI:</b> يساعده على فهم أسئلة التلميذ والرد بطريقة صحيحة</div><div><b>الروبوتات:</b> يتحدث أو يكتب أو يتحرك ليعرض الإجابة</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: يسأل الطالب \"ما عاصمة مصر؟\" فيفهم الروبوت السؤال ويجيب \"القاهرة\".</div>"], ["🌾 الزراعة الذكية", "<div class=\"tri\"><div><b>IoT:</b> تنقل أجهزة الاستشعار معلومات عن حالة التربة</div><div><b>AI:</b> يحلل البيانات ليعرف هل تحتاج الأرض إلى الماء</div><div><b>الروبوتات:</b> تسقي النباتات أو ترش المبيدات تلقائيًا</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: إذا كانت التربة جافة يقرر النظام أن يسقي الأرض دون تدخل المزارع.</div>"], ["🎙️ المساعد الصوتي", "<div class=\"tri\"><div><b>IoT:</b> يُستخدم للوصول إلى المعلومات عبر الإنترنت</div><div><b>AI:</b> يفهم ما تقوله ويقدم إجابة مناسبة</div><div><b>الروبوتات:</b> <b>غير موجودة</b> هنا لأن الجهاز لا يتحرك، لكنه يتحدث فقط</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: تقول \"ما الطقس اليوم؟\" فيفهم الجهاز سؤالك ويجيب بصوت واضح.</div>"], ["🚗 السيارة الذكية", "<div class=\"tri\"><div><b>IoT:</b> يربط السيارة بالأقمار الصناعية والخرائط</div><div><b>AI:</b> يراقب الطريق ويحلل المخاطر</div><div><b>الروبوتات:</b> تتحكم في حركة السيارة مثل التوقف أو تغيير الاتجاه</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: إذا عبر طفل الطريق فجأة ترى السيارة ذلك وتتوقف وحدها لحمايتك.</div>"]]}, {"type": "acc", "h": "٤) الأنظمة الذكية وتأثيرها على التغيرات المناخية", "l": "يواجه كوكبنا مشكلات: ارتفاع الحرارة، تلوث الهواء، ذوبان الجليد، الجفاف، الفيضانات. اضغط على كل مشكلة:", "items": [["🌡️ ارتفاع حرارة الأرض (الاحتباس الحراري)", "<b>السبب:</b> زيادة الغازات الضارة مثل ثاني أكسيد الكربون من المصانع والسيارات.<div class=\"tri\"><div><b>IoT:</b> أجهزة حساسة تقيس درجة الحرارة ونسبة التلوث في الجو</div><div><b>AI:</b> يحلل البيانات ويقترح حلولًا لتقليل التلوث</div><div><b>الروبوتات:</b> يمكنها زراعة الأشجار أو تنقية الهواء آليًا</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: عند ارتفاع الحرارة يُرسل النظام إنذارًا للحكومة لتقليل عوادم المصانع وتشغيل فلاتر تنقية الهواء.</div>"], ["🏭 تلوث الهواء", "<b>السبب:</b> عوادم السيارات والمصانع وحرق القمامة.<div class=\"tri\"><div><b>IoT:</b> تقيس نسبة الغازات الضارة في الجو</div><div><b>AI:</b> يحدد الأماكن الملوثة ويقترح تقليل عدد السيارات</div><div><b>الروبوتات:</b> زراعة النباتات أو أجهزة تنقية الهواء</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: في بعض المدن تُرسل إشعارات للسكان تطلب منهم البقاء في المنزل عند ارتفاع تلوث الهواء.</div>"], ["🏜️ نقص المياه والجفاف", "<b>السبب:</b> الاستخدام الزائد للماء وقلة المطر وعدم تنظيم الري.<div class=\"tri\"><div><b>IoT:</b> أجهزة تقيس رطوبة التربة وتبلغ متى تحتاج الأرض للماء</div><div><b>AI:</b> يحسب الكمية المناسبة من الماء</div><div><b>الروبوتات:</b> تروي الأرض تلقائيًا فقط عند الحاجة</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: في بعض المزارع لا تُروى الأرض إلا عندما ترسل الحساسات إشارة أنها بحاجة للماء، مما يوفر كميات ضخمة.</div>"], ["🌧️ الفيضانات والأمطار الغزيرة", "<b>السبب:</b> التغيرات المناخية تؤدي إلى أمطار شديدة ومفاجئة.<div class=\"tri\"><div><b>IoT:</b> تقيس كمية الأمطار وسرعة المياه في الشوارع</div><div><b>AI:</b> يرسل تحذيرات قبل الفيضان ويقترح طرق الإنقاذ</div><div><b>الروبوتات:</b> تساعد في تصريف المياه أو إنقاذ الأشخاص في الحالات الطارئة</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: عندما تكتشف الحساسات أن الماء بدأ يرتفع يُغلق الطريق تلقائيًا وتُوجَّه السيارات إلى طرق آمنة.</div>"], ["🧊 ذوبان الجليد في القطبين", "<b>السبب:</b> التغير المناخي المستمر الذي يرفع درجات الحرارة.<div class=\"tri\"><div><b>IoT:</b> تراقب الجليد وتقيس سرعة ذوبانه</div><div><b>AI:</b> يتوقع متى سيذوب الجليد ويقترح طرقًا للوقاية</div><div><b>الروبوتات:</b> تُستخدم في مراقبة الجليد أو حمايته من التآكل السريع</div></div><div class=\"tip\" style=\"margin-top:10px\">مثال: روبوتات خاصة ترسل بيانات دقيقة للعلماء ليحددوا كيف يمكن تقليل التلوث والاحتباس الحراري.</div>"]]}, {"type": "act", "k": "💬 نشاط جماعي", "t": "اقترح أفكارًا يمكن من خلالها توظيف الأنظمة الذكية المترابطة في مواجهة المشكلات البيئية.", "gold": false}, {"type": "steps", "h": "٥) كيف أصمّم نظامًا ذكيًا؟ (مثال: توفير مياه المدرسة)", "l": "خطوات التفكير التي تساعدك على حل أسئلة التطبيق:", "items": [["حدّد المشكلة", "هدر المياه من الصنابير في المدرسة."], ["اختر مكوّن IoT", "حساسات تقيس استهلاك الماء وتكشف التسرب."], ["اختر دور AI", "يحلل أنماط الاستخدام ويحدد وقت الهدر."], ["اختر المنفّذ", "روبوت أو صمام ذكي يغلق الصنبور تلقائيًا."], ["قيّم النتيجة", "هل قلّ الاستهلاك؟ وما التكلفة والصيانة؟"]]}, {"type": "cards", "h": "٦) مزايا وتحديات الأنظمة الذكية", "l": "الرأي المتوازن: هي أدوات مساعدة لتحسين الحياة مع الحاجة لضوابط أخلاقية.", "items": [["✅", "المزايا", "توفير الوقت والجهد، مراقبة البيئة بدقة، توفير المياه والطاقة، تحسين الخدمات (نقل، صحة، طاقة)، التدخل السريع في الطوارئ."], ["💰", "التكلفة والصيانة", "التكلفة العالية واحتياجات الصيانة هي أكبر تحدٍّ لتطبيقها على نطاق واسع."], ["📶", "الاعتماد على التقنية", "تحتاج إنترنت وكهرباء، وفشل النظام قد يسبب أخطاء (كما في السيارات ذاتية القيادة)."], ["❤️", "الجانب الإنساني", "الروبوتات لا توفر الدعم العاطفي مثل البشر (مثل رعاية كبار السن) ولا تحل محل المعلم."]]}, {"type": "act", "k": "💡 هل تعلم؟", "t": "الأنظمة الذكية لا تعمل بالسحر، فأي خطأ في بيانات الحساسات يؤدي لقرارات خاطئة. لذلك دقة البيانات (وهو ما سندرسه في الدرسين الثالث والرابع) هي أساس نجاحها.", "gold": true}, {"type": "text", "h": "قيّم نفسك", "t": "بعد الدرس اسأل نفسك: هل أستطيع أن (١) أشرح الأنظمة الذكية المترابطة؟ (٢) أستنتج تأثيرها على المشكلات البيئية؟ (٣) أقترح أفكارًا لتوظيفها؟ ضع علامة: جيد / جيد جدًا / بحاجة لمجهود أكبر."}], "unit": "الوحدة الأولى • الذكاء الاصطناعي وحماية بياناتنا الرقمية", "pdf": "https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Prepratory/Prepratory2/Term1/StudentBook/ICT_ARABIC_Prp2_TR1.pdf", "key": "g2-u1l1", "say": "الذكاء الاصطناعي والروبوتات وIoT لما يتجمعوا بيحموا البيئة 🌍🤖", "root": "../../../"})</script></body></html>
