<!doctype html><html lang="ar" dir="rtl"><head><script src="../../../assets/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التهديدات السيبرانية المتقدمة | Techora</title><link rel="icon" href="../../../assets/logo.svg"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../../../firebase-config.js"></script><script src="../../../auth-core.js"></script><script src="../../../techora-config.js"></script><script src="../../../assets/data.js"></script><script src="../../../auth-guard.js" data-root="../../../"></script><link rel="stylesheet" href="../../../assets/lesson.css"></head><body><div class="top"><a href="../../../grade-2/term-1.html">→ دروس الفصل الأول</a><span class="t">الدرس الثاني • المحتوى</span><a href="../../../index.html">Techora ⌂</a></div><main class="wrap" id="app"></main><script src="../../../assets/lesson.js"></script><script>TLesson.render({"title": "التهديدات السيبرانية المتقدمة", "pages": "ص ٢٣ – ٣٢", "intro": "المخترقون مش بس فيروسات بسيطة. فيه هجمات متخطط لها بعناية بتستغل نقط ضعف في الأجهزة وحتى في سلوكنا إحنا.", "goals": ["أشرح التهديدات الاحتيالية المتقدمة.", "أذكر أكبر عدد من الأفكار لمواجهة التهديدات السيبرانية المتقدمة.", "أقترح خطة لمواجهة هجمات الحرمان من الخدمة الموزعة DDoS."], "summary": "التهديدات المتقدمة بتستهدف الأجهزة والبشر معًا: <b>الفدية</b> تقفل ملفاتك، و<b>الهندسة الاجتماعية</b> تخدعك، و<b>DDoS</b> تعطّل المواقع. وأنت خط الدفاع الأول: كن حذرًا وذكيًا على الإنترنت.", "sections": [{"type": "act", "k": "🗣️ لنتفاعل معًا", "t": "ماذا تعرف عن مفهوم <b>الهندسة الاجتماعية</b> في عالم الإنترنت؟"}, {"type": "cards", "h": "١) ما التهديدات السيبرانية المتقدمة؟", "l": "مثل لصوص محترفين بيستخدموا أساليب متطورة لسرقة معلوماتنا أو إلحاق الضرر بنا.", "items": [["🎯", "مخطّطة بعناية", "مش فيروسات بسيطة، لكن هجمات متخطط لها مسبقًا."], ["🕳️", "تستغل نقط الضعف", "في الأنظمة أو الأجهزة أو حتى في سلوك المستخدم."], ["🕵️", "بتتنكر", "زي لص بيراقب البيت ويتظاهر إنه عامل صيانة عشان يدخل."]]}, {"type": "text", "t": "<b>مثال من الكتاب:</b> اللص اللي عايز يدخل بيتك مش بيكسر الباب الرئيسي بس. بيراقب مواعيد خروجكم، ويجرّب النافذة الخلفية، وممكن يتظاهر إنه عامل إصلاح. وده بالظبط اللي بيحاوله المخترقون في العالم الرقمي."}, {"type": "steps", "h": "٢) برامج الفدية Ransomware", "l": "تخيّل حد قفل بيتك عليك وقالك ادفع عشان أفتحه. ده شغل برامج الفدية!", "items": [["الوصول", "بتنتشر غالبًا عبر رسائل بريد مشبوهة أو مواقع ضارة أو روابط مخادعة أو تنزيل برنامج من موقع غير موثوق."], ["التشفير", "بمجرد دخولها الجهاز بتشفّر الملفات بسرعة (تخليها غير قابلة للقراءة) أو تقفل الجهاز."], ["الفدية", "بتظهر رسالة بتطلب مبلغ مالي (فدية) عشان تسترجع الوصول لملفاتك."]]}, {"type": "act", "t": "ناقش مع زمايلك: لماذا تعتبر برامج الفدية تهديدًا خطيرًا؟ وما الطرق التي نحمي بها أنفسنا وأجهزتنا منها؟"}, {"type": "acc", "h": "٣) الهندسة الاجتماعية المتقدمة", "l": "مش اختراق للأجهزة، لكنها <b>اختراق للعقول</b>: فن خداع الناس عشان يكشفوا معلومات سرية أو يعملوا حاجة تعرّضهم للخطر.", "items": [["🎣 التصيد الاحتيالي الموجه (Spear Phishing)", "نوع متقدم من التصيد بيستهدف أشخاصًا أو مؤسسات محددة برسائل بريد أو نصوص تبدو شخصية ومقنعة جدًا. المهاجم بيجمع بياناتك (اسمك ومعلومات من السوشيال ميديا) عشان تثق فيه."], ["🎭 انتحال الشخصية (Pretexting)", "المهاجم بيألّف قصة وهمية عشان يخدعك ويحصل على معلومات، فممكن يتظاهر إنه موظف دعم فني أو مسؤول في بنك."], ["🪤 الاستدراج (Baiting)", "المهاجم بيقدم حاجة مغرية (زي فلاشة USB مجانية فيها برنامج ضار) عشان تدوس عليها أو تستخدمها."]]}, {"type": "act", "t": "فكّر في أمثلة لرسائل أو مكالمات احتيالية قد تتلقاها أنت أو أحد زمايلك. وكيف تميّز الرسالة الحقيقية من المزيفة؟"}, {"type": "steps", "h": "٤) هجمات الحرمان من الخدمة الموزعة DDoS", "l": "تخيّل موقعًا مشهورًا فجأة دخله عدد ضخم من الناس في نفس اللحظة، فيقع! زي شارع اتسد بالسيارات ومحدش يعرف يعدّي.", "items": [["المهاجم", "يخترق عددًا كبيرًا من الأجهزة ويكوّن منها شبكة روبوتية Botnet."], ["الهجوم", "يأمر الأجهزة كلها تبعت كميات هائلة من الطلبات لخادم الموقع في نفس الوقت."], ["النتيجة", "الموقع يبطّأ أو يتعطّل، والمستخدمون الحقيقيون مايقدروش يدخلوا."]]}, {"type": "act", "t": "ارسم مخططًا بسيطًا يوضح كيف تحدث هجمة DDoS، وناقش: ما الآثار السلبية لهذه الهجمات على الشركات والمستخدمين؟"}, {"type": "table", "h": "ملخص سريع", "head": ["التهديد", "ماذا يفعل؟", "كيف أحمي نفسي؟"], "rows": [["الفدية", "تشفّر ملفاتك وتطلب مالًا", "لا تفتح روابط أو مرفقات مشبوهة ولا تنزّل من مواقع غير موثوقة، وحدّث البرامج ومضاد الفيروسات."], ["الهندسة الاجتماعية", "تخدعك لتكشف معلوماتك", "تحقّق من هوية المتصل، ولا تشارك بياناتك الشخصية أو كلمات المرور."], ["DDoS", "تعطّل موقعًا أو خدمة", "التحديثات الأمنية وتأمين الأجهزة حتى لا تتحول إلى Botnet."]]}, {"type": "text", "h": "تذكّر ما درسته في الأعوام السابقة", "t": "عرفنا كيف نحافظ على بياناتنا: <b>كلمات مرور قوية</b> يصعب تخمينها، و<b>تحديث برامج مكافحة الفيروسات</b> لمنع سرقة البيانات. لكن المخترقين تطوّروا، فصاروا يستهدفون <b>الإنسان</b> نفسه، ولذلك نحتاج وعيًا أكبر."}, {"type": "table", "h": "مقارنة سريعة بين أساليب الهندسة الاجتماعية", "head": ["الأسلوب", "كيف يعمل؟", "مثال"], "rows": [["التصيد الموجه Spear Phishing", "رسالة شخصية لشخص أو مؤسسة محددة بعد جمع معلومات عنه", "رسالة باسمك واسم مدرستك تطلب فتح رابط"], ["انتحال الشخصية Pretexting", "قصة وهمية يدّعي فيها صفة رسمية", "\"أنا من دعم البنك، أعطني الرقم السري\""], ["الاستدراج Baiting", "طُعم مغرٍ يدفعك لاستخدامه", "فلاشة USB مجانية عليها \"صور خاصة\""]]}, {"type": "cards", "h": "كيف أكتشف رسالة التصيد؟", "items": [["⏰", "استعجال وتهديد", "\"سيُغلق حسابك خلال ساعة!\""], ["✉️", "مرسل غريب", "عنوان بريد غير رسمي أو متغيّر بحرف."], ["🔗", "رابط مريب", "ضع المؤشر على الرابط ولا تضغط قبل التأكد."], ["🔐", "طلب بيانات سرية", "المؤسسات الحقيقية لا تطلب كلمة مرورك."]]}, {"type": "acc", "h": "ماذا أفعل عند الإصابة أو الشك؟", "items": [["🔒 إذا أصابتني برامج الفدية", "افصل الجهاز عن الإنترنت فورًا، لا تسارع بدفع الفدية (لا ضمان لاسترجاع الملفات)، أخبر معلمك أو ولي أمرك أو مختصًا، واسترجع ملفاتك من <b>نسخة احتياطية</b> منفصلة إن وُجدت."], ["🎣 إذا شككت في رسالة", "لا تضغط الرابط ولا تفتح المرفق، تحقق من المرسل عبر وسيلة أخرى رسمية، ثم أبلغ عن الرسالة واحذفها."], ["🌐 كيف أمنع تحول جهازي إلى Botnet", "حدّث نظام التشغيل والتطبيقات (التحديثات الأمنية تسد الثغرات)، استخدم كلمات مرور قوية ومختلفة، ولا تنزّل برامج من مصادر غير موثوقة."]]}, {"type": "text", "h": "DoS مقابل DDoS", "t": "في هجمة DoS يأتي الإغراق من مصدر واحد غالبًا فيسهل حظره. أما في <b>DDoS</b> فتأتي الطلبات من آلاف الأجهزة المخترقة <b>الموزعة</b> في أماكن مختلفة (Botnet)، فيصعب تمييزها عن الزوار الحقيقيين وحظرها."}, {"type": "act", "k": "💡 هل تعلم؟", "t": "في عام 2017 انتشر برنامج الفدية <b>WannaCry</b> وأصاب مئات الآلاف من الأجهزة في أكثر من 150 دولة، وعطّل خدمات في مستشفيات وشركات. وكان من أسباب انتشاره أجهزة لم تُحدَّث أمنيًا.", "gold": true}], "unit": "الوحدة الأولى • الذكاء الاصطناعي وحماية بياناتنا الرقمية", "pdf": "https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Prepratory/Prepratory2/Term1/StudentBook/ICT_ARABIC_Prp2_TR1.pdf", "key": "g2-u1l2", "say": "خليك ذكي على النت.. إنت خط الدفاع الأول 🛡️", "root": "../../../"})</script></body></html>
