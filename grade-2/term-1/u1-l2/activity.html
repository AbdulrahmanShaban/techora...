ة تخترق العقول لا الأجهزة."}, {"q": "ماذا تعني \"التحديثات الأمنية\"؟", "a": ["إصلاح الثغرات الأمنية في البرامج والأجهزة", "تغيير شكل نظام التشغيل", "إضافة ميزات جديدة فقط", "تسريع التطبيقات"], "c": 0, "why": "التحديثات تسدّ الثغرات اللي يستغلها المخترقون."}, {"q": "ما هي الـ Botnets المستخدمة في هجمات DDoS؟", "a": ["شبكة من الأجهزة المخترقة يتم التحكم فيها عن بعد", "برامج ذكاء اصطناعي متطورة", "أجهزة كمبيوتر فائقة السرعة", "مجموعة من الخوادم الآمنة"], "c": 0, "why": "Botnet = جيش من الأجهزة المخترقة."}, {"q": "وصلتك رسالة باسمك واسم مدرستك تطلب منك فتح رابط. أي هجوم هذا غالبًا؟", "a": ["تصيد احتيالي موجه", "هجوم DDoS", "برنامج مضاد فيروسات", "تحديث أمني"], "c": 0, "why": "الرسالة المخصّصة لشخص محدد = Spear Phishing."}, {"q": "وجدت فلاشة USB في الشارع مكتوب عليها \"صور خاصة\". ما أسلوب المهاجم؟", "a": ["الاستدراج Baiting", "انتحال الشخصية", "حرمان من الخدمة", "فدية فقط"], "c": 0, "why": "الطُّعم المغري عشان تستخدمها."}, {"q": "اتصل شخص يدّعي أنه من دعم البنك وطلب رقمك السري. ما الأسلوب؟", "a": ["انتحال الشخصية Pretexting", "الاستدراج", "DDoS", "Botnet"], "c": 0, "why": "قصة وهمية للحصول على معلومات."}]}, {"type": "tf", "title": "المستوى 2 • صح أم خطأ؟", "items": [{"q": "برامج الفدية تتلف جهازك بشكل دائم.", "c": false, "why": "هي تشفّر الملفات أو تقفل الجهاز وتطلب فدية لاسترجاعه."}, {"q": "هجمات DDoS تستهدف جهازًا واحدًا فقط.", "c": false, "why": "تستهدف خادمًا أو موقعًا بكميات هائلة من الطلبات."}, {"q": "الهندسة الاجتماعية تعتمد على استغلال نقاط الضعف في الأنظمة التقنية.", "c": false, "why": "تعتمد على خداع البشر."}, {"q": "مشاركة معلوماتك الشخصية مع أي شخص تثق به على الإنترنت آمنة دائمًا.", "c": false, "why": "لا تشارك معلوماتك الشخصية بسهولة."}, {"q": "التصيد الموجه يستهدف أشخاصًا محددين.", "c": true, "why": "يعتمد على بيانات مفصلة عنك."}, {"q": "الـ Botnet شبكة من الأجهزة المخترقة.", "c": true, "why": "تُستخدم لإرسال طلبات ضخمة."}]}, {"type": "mcq", "title": "المستوى 3 • أكمل الجملة", "items": [{"q": "برنامج الـ ______ يساعد في اكتشاف وإزالة البرامج الضارة.", "a": ["مضاد الفيروسات", "الفدية", "Botnet", "التصيد"], "c": 0, "why": "مضاد الفيروسات يحمي جهازك."}, {"q": "محاولة سرقة معلوماتك برسائل بريد مزيفة تسمى ______", "a": ["التصيد الاحتيالي", "الاستدراج", "الفدية", "التحديث"], "c": 0, "why": "Phishing."}, {"q": "برامج الـ ______ تشفّر ملفاتك وتطلب فدية لاستعادتها.", "a": ["Ransomware", "Antivirus", "Firewall", "Browser"], "c": 0, "why": "برامج الفدية."}, {"q": "فن خداع الناس للحصول على معلومات سرية يسمى ______", "a": ["الهندسة الاجتماعية", "التشفير", "الضغط", "النسخ الاحتياطي"], "c": 0, "why": "اختراق العقول لا الأجهزة."}, {"q": "في هجمات DDoS يتم استخدام شبكة أجهزة مخترقة تسمى ______", "a": ["Botnet", "Router", "Server", "Firewall"], "c": 0, "why": "شبكة روبوتية."}]}, {"type": "match", "title": "المستوى 4 • اربط الهجوم بوصفه", "q": "اربط كل هجوم بما يناسبه", "rounds": [[["الفدية", "تشفّر الملفات وتطلب مالًا"], ["التصيد الموجه", "رسالة شخصية مقنعة لشخص محدد"], ["انتحال الشخصية", "قصة وهمية للحصول على معلومات"], ["الاستدراج", "شيء مغري مثل USB مجاني"], ["DDoS", "طلبات هائلة تعطّل الموقع"]]]}, {"type": "mcq", "title": "المستوى 5 • 🔥 تحدي الخبراء", "n": 8, "items": [{"q": "وصلتك رسالة من \"مدير المدرسة\" ببريد غريب تطلب كلمة مرور حسابك التعليمي فورًا وتقول إن الحساب سيُغلق خلال ساعة. ما العلامات الأوضح على الاحتيال؟", "a": ["الاستعجال وطلب بيانات حساسة ومرسل غير رسمي", "أسلوب الرسالة مهذب", "ذكر اسم المدرسة", "وجود شعار في الرسالة"], "c": 0, "why": "المؤسسات الرسمية لا تطلب كلمات المرور ولا تهدد بالإغلاق السريع."}, {"q": "ما الفرق الأدق بين DoS وDDoS؟", "a": ["DDoS يأتي من عدد كبير من الأجهزة الموزعة فيصعب حظره", "DDoS لا يستهدف مواقع", "DoS أخطر دائمًا", "لا فرق بينهما"], "c": 0, "why": "التوزيع على أجهزة كثيرة هو سر القوة والصعوبة."}, {"q": "لماذا تُعد التحديثات الأمنية دفاعًا فعالًا ضد برامج الفدية؟", "a": ["لأنها تسد الثغرات التي تستغلها البرامج الضارة للدخول", "لأنها تغيّر شكل الجهاز", "لأنها تزيد حجم الذاكرة", "لأنها تحذف الملفات القديمة"], "c": 0, "why": "الثغرات هي الباب الخلفي الذي يدخل منه المهاجم."}, {"q": "أصاب جهازك برنامج فدية ولديك نسخة احتياطية حديثة على جهاز منفصل. أفضل تصرف؟", "a": ["فصل الجهاز عن الشبكة ثم استرجاع الملفات من النسخة بدل دفع الفدية", "دفع الفدية بسرعة", "إغلاق الجهاز وعدم إخبار أحد", "تحميل برنامج مجهول لفك التشفير"], "c": 0, "why": "النسخة الاحتياطية تجعل الدفع غير ضروري."}, {"q": "اتصل بك شخص يقول إنه فني شركة الإنترنت ويطلب كلمة مرور الراوتر لإصلاح خلل. أي أسلوب هذا؟", "a": ["انتحال الشخصية Pretexting", "الاستدراج Baiting", "هجوم DDoS", "برنامج فدية"], "c": 0, "why": "قصة وهمية بصفة رسمية للحصول على معلومات."}, {"q": "لماذا يصعب على برامج الحماية وحدها اكتشاف الهندسة الاجتماعية؟", "a": ["لأنها تستهدف قرار الإنسان لا ثغرة تقنية", "لأنها لا تستخدم الإنترنت", "لأنها تحدث بدون رسائل", "لأن الأجهزة لا تتأثر بها"], "c": 0, "why": "الضحية هو من يسلّم المعلومة بنفسه."}, {"q": "مهاجم جمع اسمك ومدرستك من حساباتك العامة ثم راسلك برسالة مقنعة. ما الدرس الأهم؟", "a": ["ما ننشره علنًا قد يُستخدم لجعل الرسائل الاحتيالية أكثر إقناعًا", "يجب حذف الإنترنت", "الرسائل الشخصية آمنة دائمًا", "المهاجمون لا يقرؤون الحسابات"], "c": 0, "why": "هذا ما يفعله التصيد الموجه."}, {"q": "أي إجراء لا يساعد في الحماية من هذه التهديدات؟", "a": ["فتح أي مرفق يصل من شخص غير معروف للتأكد منه", "تحديث مضاد الفيروسات", "عدم توصيل USB مجهول", "التحقق من هوية المتصل"], "c": 0, "why": "الفضول هو ما يستغله المهاجم."}]}, {"type": "tf", "title": "المستوى 6 • 🔥 صح أم خطأ للخبراء", "items": [{"q": "وجود مضاد فيروسات حديث يغني تمامًا عن الحذر من الهندسة الاجتماعية.", "c": false, "why": "لأنها تخدع الإنسان لا الجهاز."}, {"q": "هدف DDoS الأساسي سرقة بيانات المستخدمين.", "c": false, "why": "هدفه تعطيل الخدمة."}, {"q": "قد يصل برنامج الفدية عبر مرفق في رسالة بريد.", "c": true, "why": "من أشهر طرق انتشاره."}, {"q": "التصيد الموجه أعم وأقل تخصيصًا من التصيد العادي.", "c": false, "why": "هو أكثر تخصيصًا واستهدافًا."}, {"q": "يمكن أن يشارك جهازك في هجوم DDoS دون علمك إذا اخترق وأصبح ضمن Botnet.", "c": true, "why": "الأجهزة المخترقة تُدار عن بُعد."}]}], "mount": "#game", "avatar": "../../../assets/teacher/g2-
