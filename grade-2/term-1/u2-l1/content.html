<!doctype html><html lang="ar" dir="rtl"><head><script src="../../../assets/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مبادئ تصميم واجهات احترافية شيقة للمواقع الإلكترونية | Techora</title><link rel="icon" href="../../../assets/logo.svg"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../../../firebase-config.js"></script><script src="../../../auth-core.js"></script><script src="../../../techora-config.js"></script><script src="../../../assets/data.js"></script><script src="../../../auth-guard.js" data-root="../../../"></script><link rel="stylesheet" href="../../../assets/lesson.css"></head><body><div class="top"><a href="../../../grade-2/term-1.html">→ دروس الفصل الأول</a><span class="t">الوحدة الثانية • الدرس الأول • المحتوى</span><a href="../../../index.html">Techora ⌂</a></div><main class="wrap" id="app"></main><script src="../../../assets/lesson.js"></script><script>TLesson.render({"title": "مبادئ تصميم واجهات احترافية شيقة للمواقع الإلكترونية", "pages": "ص ٤٥ – ٥٨", "unit": "الوحدة الثانية • تصميم وإنشاء مواقع الويب", "intro": "ليه بترتاح في مواقع وتتضايق في مواقع تانية؟ السر في تصميم تجربة المستخدم UX وتصميم الواجهة UI.", "goals": ["أشرح بعض المفاهيم المرتبطة بتصميم المواقع (تصميم واجهة المستخدم UI – تجربة المستخدم UX).", "أذكر أكبر عدد من الأفكار لمواقع ويب ذات تصميم جيد UX/UI.", "أوظّف بعض مبادئ UI/UX الأساسية في أنشطة بسيطة داخل الفصل."], "summary": "<b>UX</b> = سهولة الاستخدام والراحة (التنقل، الوضوح، التناسق). <b>UI</b> = الشكل الجذاب والمرتب (الألوان، الخطوط، التخطيط). التصميم الناجح يجمع الاثنين: موقع <b>جميل وسهل</b> في نفس الوقت.", "sections": [{"type": "act", "k": "🗣️ لنتفاعل معًا", "t": "من خلال تصفحك لمواقع الإنترنت، ما أكثر الأشياء التي تمنحك سهولة في استخدام الموقع؟", "gold": false}, {"type": "text", "h": "١) تصميم تجربة المستخدم UX (User Experience)", "t": "تخيّل أنك تصمم لعبة تعليمية: يجب أن تفكر في كل خطوة سيقوم بها اللاعب وكيف سيشعر. هل اللعبة سهلة الفهم؟ هل الأوامر واضحة؟ هل سيستمتع بوقته؟ هذا ما نسميه <b>UX</b>: التفكير في كيفية استخدام الناس للموقع، وهل يجدون ما يحتاجونه بسهولة، وهل يشعرون بالسعادة أثناء الاستخدام."}, {"type": "cards", "l": "مثال المكتبة: لو الكتب مرتبة بشكل منظم يكون البحث سهلًا ومريحًا، ولو ملقاة عشوائيًا تشعر بالإحباط.", "items": [["📚", "مرتبة ومنظمة", "بحث سهل وراحة واستخدام ممتع."], ["🌀", "عشوائية", "إحباط وتضييع للوقت وتركٌ للموقع."]]}, {"type": "text", "t": "<b>أهمية UX:</b> إذا كان الموقع سهل الاستخدام يشعر المستخدم بالرضا ويعود إليه مرة أخرى، وإذا كان صعبًا قد يتركه إلى الأبد."}, {"type": "act", "k": "💬 نشاط جماعي", "t": "اذكر اسم موقع أو تطبيق تستخدمه، وصف أسباب سهولته أو صعوبته. ثم ناقش المبادئ الأساسية التي تسهّل على المستخدم التعامل مع الموقع.", "gold": false}, {"type": "acc", "h": "مبادئ UX الأساسية", "items": [["🧭 سهولة التنقل (Navigation)", "أن يصل المستخدم إلى ما يبحث عنه بسرعة ودون عناء.<div class=\"tri\"><div><b>جيد:</b> قائمة رئيسية بأزرار واضحة مثل \"الرئيسية\" و\"الكتب\" و\"الاتصال\".</div><div><b>سيئ:</b> قائمة متداخلة بعناصر فرعية كثيرة وغير واضحة تربك المستخدم.</div></div>"], ["🔍 الوضوح (Clarity)", "تقديم المعلومات بطريقة سهلة الفهم.<div class=\"tri\"><div><b>جيد:</b> نص بخط كبير وواضح يُقرأ بسهولة.</div><div><b>سيئ:</b> نص بخط صغير ومزخرف صعب القراءة قد يسبب الإحباط.</div></div>"], ["🧩 التناسق (Consistency)", "الحفاظ على نفس الأسلوب في جميع أنحاء الموقع.<div class=\"tri\"><div><b>جيد:</b> الأزرار بنفس الشكل واللون في كل مكان فتبدو مألوفة.</div><div><b>سيئ:</b> أزرار بأشكال وألوان مختلفة تربك المستخدم.</div></div>"]]}, {"type": "act", "k": "💬 نشاط جماعي", "t": "ارسم قائمة تصفح بسيطة لتطبيق من خيالك. اكتب \"الماء سر الحياة\" بخط واضح ثم بخط معقد وقارن. صمّم زرين بنفس الشكل واللون لتوضح أهمية التناسق.", "gold": false}, {"type": "text", "h": "٢) تصميم واجهة المستخدم UI (User Interface)", "t": "<b>UI</b> هو الشكل الذي يظهر به الموقع أو التطبيق: هل الألوان جميلة؟ هل الأزرار واضحة؟ هل الخطوط سهلة القراءة؟ كل ذلك يشكّل الواجهة التي يراها المستخدم ويتفاعل معها. <br><b>مثال:</b> لو كانت أزرار التطبيق صغيرة جدًا بحيث لا يمكن الضغط عليها بسهولة، فهذه مشكلة في تصميم UI.<br><b>أهميته:</b> الجاذبية البصرية تعطي انطباعًا أوليًا جيدًا، وإذا لم تكن الواجهة جذابة فلن تعجب المستخدمين."}, {"type": "acc", "h": "مبادئ UI الأساسية", "items": [["🎨 الألوان", "اختيار الألوان المناسبة يؤثر على مزاج المستخدم.<div class=\"tri\"><div><b>جيد:</b> نظام ألوان متناسق مثل الأزرق والرمادي، هادئ ومريح.</div><div><b>سيئ:</b> ألوان صارخة (أحمر وأصفر وبنفسجي) مزعجة وتشتت الانتباه.</div></div>"], ["🔤 الخطوط", "يجب أن تكون مقروءة ومناسبة للسياق.<div class=\"tri\"><div><b>جيد:</b> خط بسيط وواضح، سهل القراءة ويبدو رسميًا.</div><div><b>سيئ:</b> خط معقد وزخرفي صعب القراءة وغير مناسب للتطبيقات العملية.</div></div>"], ["📐 التخطيط (Layout)", "تنظيم العناصر بشكل منطقي يجعل الموقع سهل الاستخدام.<div class=\"tri\"><div><b>جيد:</b> صفحة مقسمة لأقسام واضحة (\"الرئيسية\"، \"الأخبار\"، \"المقالات\").</div><div><b>سيئ:</b> صفحة مليئة بعناصر متلاصقة، مزدحمة وتسبب الصداع.</div></div>"]]}, {"type": "act", "k": "💬 نشاط جماعي", "t": "اختر ثلاثة ألوان متناسقة لواجهة خيالية، وثلاثة أسماء خطوط مناسبة لتطبيق تعليمي، وصمّم على ورقة صفحة مقسمة لثلاثة أقسام منظمة.", "gold": false}, {"type": "table", "h": "الفرق بين UX وUI", "head": ["", "UX تجربة المستخدم", "UI واجهة المستخدم"], "rows": [["التركيز", "سهولة الاستخدام والراحة", "الشكل الجذاب والمنظم"], ["يجيب عن", "هل أجد ما أريد بسهولة؟", "هل يبدو جميلًا وواضحًا؟"], ["أمثلة", "التنقل، الوضوح، التناسق", "الألوان، الخطوط، التخطيط"], ["مثال المطعم", "جودة الطعام والخدمة", "الديكور والألوان والواجهة"]]}, {"type": "cards", "h": "أمثلة لمواقع جيدة", "items": [["🔎", "Google", "بسيط وسهل الاستخدام، تجد ما تحتاجه بسرعة."], ["▶️", "YouTube", "تصميم جذاب وسهل التنقل."]]}, {"type": "cards", "h": "قواعد ذهبية إضافية", "l": "معلومات تساعدك في أنشطتك التطبيقية:", "items": [["🎯", "2–3 ألوان فقط", "يحافظ على التناغم ويمنع التشتت."], ["🌗", "تباين جيد", "نص غامق على خلفية فاتحة (أو العكس) لسهولة القراءة."], ["🫧", "مساحات فارغة", "تعطي التصميم راحة وتبرز العناصر المهمة."], ["👆", "أزرار مناسبة الحجم", "سهلة اللمس على الموبايل."], ["📱", "تجاوب مع الشاشات", "يظهر الموقع جيدًا على الكمبيوتر والتابلت والموبايل."], ["♿", "سهولة الوصول", "خطوط واضحة وألوان مقروءة تناسب الجميع."]]}, {"type": "act", "k": "🗣️ نشاط تطبيقي", "t": "كوّن مجموعة صغيرة وناقش موقعًا أو تطبيقًا تستخدمونه يوميًا: ما الذي يجعله سهلًا وممتعًا؟ وما الذي يمكن تحسينه في تصميمه؟", "gold": false}], "pdf": "https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Prepratory/Prepratory2/Term1/StudentBook/ICT_ARABIC_Prp2_TR1.pdf", "key": "g2-u2l1", "say": "الموقع الشاطر بيجمع بين الجمال والسهولة 🎨🧭", "root": "../../../"})</script></body></html>
