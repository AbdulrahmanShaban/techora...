<!doctype html><html lang="ar" dir="rtl"><head><script src="../../../assets/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البيانات الضخمة | Techora</title><link rel="icon" href="../../../assets/logo.svg"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../../../firebase-config.js"></script><script src="../../../auth-core.js"></script><script src="../../../techora-config.js"></script><script src="../../../assets/data.js"></script><script src="../../../auth-guard.js" data-root="../../../"></script><link rel="stylesheet" href="../../../assets/lesson.css"></head><body><div class="top"><a href="../../../grade-2/term-1.html">→ دروس الفصل الأول</a><span class="t">الدرس الثالث • المحتوى</span><a href="../../../index.html">Techora ⌂</a></div><main class="wrap" id="app"></main><script src="../../../assets/lesson.js"></script><script>TLesson.render({"title": "البيانات الضخمة", "pages": "ص ٣٣ – ٣٦", "intro": "كل مرة تفتح موبايلك أو تشتري أونلاين أو تشوف فيديو، بيتولّد بيانات. لما تتجمع بكميات ضخمة اسمها بيانات ضخمة!", "goals": ["أشرح خصائص البيانات الضخمة.", "أناقش مصادر البيانات الضخمة الآمنة.", "أستنتج أنواع البيانات الضخمة."], "summary": "<b>البيانات الضخمة</b> بيانات هائلة ومعقدة تحتاج أدوات متقدمة، ولها <b>5 خصائص (5Vs)</b> و<b>3 أنواع</b>، وتأتي من مصادر كثيرة. ودقة تسجيل البيانات وذكر المصادر يزيدان موثوقيتها.", "sections": [{"type": "act", "k": "🗣️ لنتفاعل معًا", "t": "ما البيانات الضخمة؟ وكيف يمكن الحصول على البيانات بشكل آمن يساعدنا على اتخاذ القرارات المناسبة؟"}, {"type": "text", "h": "١) مفهوم البيانات الضخمة", "t": "مجموعة من البيانات <b>الضخمة والمعقدة</b> التي لا يمكن معالجتها بكفاءة باستخدام التكنولوجيا التقليدية (مثل برنامج إكسل). وتحليلها يتيح للمحللين والباحثين ورواد الأعمال <b>اتخاذ قرارات أفضل وأسرع</b>."}, {"type": "flip", "h": "٢) مصادر البيانات الضخمة", "l": "اضغط على كل مصدر لتعرف مثاله.", "items": [["⌚", "الأجهزة المتصلة (IoT)", "تولّد بيانات باستمرار عن الموقع والحرارة والسلوك. مثال: ساعة ذكية تقيس ضربات القلب ومستوى النشاط."], ["📱", "وسائل التواصل الاجتماعي", "منشورات وتعليقات وصور وإعجابات. وقد تكون هذه المصادر غير موثوقة. مثال: صورة على إنستغرام تولّد بيانات التوقيت والموقع والهاشتاجات."], ["💳", "البيانات المالية", "الدفع الإلكتروني والمعاملات البنكية. مثال: الشراء ببطاقة ائتمان يسجّل المبلغ والمتجر والموقع."], ["📲", "الأجهزة الذكية", "الهواتف والكاميرات وأجهزة المنزل الذكي. مثال: الموبايل يتتبع موقعك والتطبيقات التي استخدمتها."], ["🎬", "المحتوى الرقمي", "فيديوهات وصور وصوتيات. مثال: مشاهدة فيديو على يوتيوب تسجّل مدة المشاهدة والتفاعل والتعليقات."], ["🏛️", "البيانات الحكومية", "سجلات السكان والإحصاءات والضرائب والتعداد."], ["🛰️", "البيانات الجغرافية", "الأقمار الصناعية وGPS. مثال: تطبيق الخرائط يجمع حركة المرور والطرق المزدحمة."]]}, {"type": "cards", "h": "٣) الخصائص الخمس للبيانات الضخمة (5Vs)", "items": [["📦", "الحجم Volume", "الكمية الهائلة من البيانات المجمّعة والمخزّنة."], ["⚡", "السرعة Velocity", "سرعة إنتاج البيانات ومعالجتها، مثل المدفوعات والتحديثات."], ["🎨", "التنوع Variety", "تنوع الأنواع: هيكلية وغير هيكلية كالنصوص والصور والفيديو."], ["✅", "الصحة Veracity", "موثوقية البيانات وجودتها، فقد تحتوي أخطاء."], ["💎", "القيمة Value", "الفائدة التي نستخلصها من البيانات."]]}, {"type": "acc", "h": "٤) أنواع البيانات الضخمة", "items": [["🗂️ البيانات الهيكلية", "منظمة في جداول بصفوف وأعمدة مثل قواعد البيانات التقليدية. أمثلة: بيانات العملاء، البيانات المالية، سجلات المعاملات."], ["🖼️ البيانات غير الهيكلية", "لا تأتي في شكل منظم كالجداول، وصعبة التحليل بالأدوات التقليدية. المصادر: النصوص والصور والفيديوهات والمنشورات. مثال: منشور فيسبوك بنص وصور وفيديو."], ["✉️ البيانات شبه الهيكلية", "مزيج من الهيكلية وغير الهيكلية. مثال جيد: البريد الإلكتروني، فيه نص غير هيكلي مع خصائص هيكلية كالمرسل والمستلم والموضوع والتاريخ."]]}, {"type": "act", "k": "💡 تذكّر", "t": "احرص دائمًا على تسجيل البيانات بدقة والإشارة إلى مصادر المعلومات التي اعتمدت عليها، فذلك يزيد موثوقيتها والتحقق من صحتها."}, {"type": "table", "h": "مقارنة بين أنواع البيانات", "head": ["النوع", "الشكل", "أمثلة", "سهولة التحليل التقليدي"], "rows": [["هيكلية", "جداول: صفوف وأعمدة", "بيانات العملاء، سجلات المعاملات", "سهلة"], ["غير هيكلية", "بلا تنظيم ثابت", "نصوص، صور، فيديو، منشورات", "صعبة"], ["شبه هيكلية", "مزيج من النوعين", "البريد الإلكتروني (مرسل/مستلم/تاريخ + نص حر)", "متوسطة"]]}, {"type": "table", "h": "الخصائص الخمس مع أمثلة", "head": ["الخاصية", "السؤال الذي تجيب عنه", "مثال"], "rows": [["Volume الحجم", "كم حجم البيانات؟", "ملايين المنشورات يوميًا"], ["Velocity السرعة", "كم سرعة ظهورها ومعالجتها؟", "عمليات الدفع الفورية"], ["Variety التنوع", "ما أنواعها؟", "نص + صورة + فيديو + جدول"], ["Veracity الصحة", "هل هي دقيقة وموثوقة؟", "بيانات فيها أخطاء أو مصدر مجهول"], ["Value القيمة", "ما الفائدة منها؟", "معرفة المنتج الأكثر طلبًا"]]}, {"type": "acc", "h": "كيف أتعامل مع البيانات بشكل آمن وموثوق؟", "items": [["✅ أتحقق من المصدر", "أفضّل المصادر الرسمية والموثقة، وأحذر من المنشورات مجهولة المصدر."], ["📝 أسجل البيانات بدقة", "الدقة في التسجيل والإشارة إلى المصدر تزيد الموثوقية وتسمح بالتحقق."], ["🔐 أحمي الخصوصية", "لا أجمع أو أشارك بيانات شخصية دون إذن، فالبيانات الضخمة قد تكشف عادات الأشخاص ومواقعهم."]]}, {"type": "text", "h": "الفرق بين البيانات والمعلومات", "t": "<b>البيانات</b> حقائق خام (أرقام، نصوص، صور) بلا معنى بمفردها، و<b>المعلومات</b> هي ناتج تحليلها بحيث تصبح مفيدة في اتخاذ القرار. ولهذا تظهر خاصية <b>القيمة</b> بعد التحليل."}, {"type": "act", "k": "💡 هل تعلم؟", "t": "لمعالجة البيانات الضخمة تُستخدم أدوات مخصصة مثل <b>Hadoop</b> و<b>Spark</b> تقسّم العمل على عدد كبير من الأجهزة، ولهذا لا يكفي برنامج مثل Excel.", "gold": true}], "unit": "الوحدة الأولى • الذكاء الاصطناعي وحماية بياناتنا الرقمية", "pdf": "https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Prepratory/Prepratory2/Term1/StudentBook/ICT_ARABIC_Prp2_TR1.pdf", "key": "g2-u1l3", "say": "البيانات حوالينا في كل مكان.. تعال نفهمها 📊", "root": "../../../"})</script></body></html>
