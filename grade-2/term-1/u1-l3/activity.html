ت والصور لا تولّد بيانات كبيرة.", "c": false, "why": "تولّد بيانات المشاهدات والتفاعل وغيرها."}, {"q": "الأقمار الصناعية وGPS تجمع بيانات جغرافية.", "c": true, "why": "مثل بيانات الخرائط والطرق."}, {"q": "السرعة في إنتاج البيانات ليست من خصائص البيانات الضخمة.", "c": false, "why": "السرعة Velocity من الخصائص الخمس."}, {"q": "الصحة Veracity تشير إلى موثوقية البيانات وجودتها.", "c": true, "why": "هل البيانات دقيقة؟"}, {"q": "البيانات الهيكلية تأتي في شكل غير منظم.", "c": false, "why": "الهيكلية منظمة في جداول."}, {"q": "البيانات غير الهيكلية لا تأتي في جداول أو قواعد بيانات منظمة.", "c": true, "why": "مثل النصوص والصور."}, {"q": "البريد الإلكتروني مثال جيد على البيانات الهيكلية.", "c": false, "why": "هو مثال على شبه الهيكلية."}]}, {"type": "mcq", "title": "المستوى 2 • حدّد الخاصية", "items": [{"q": "ملايين عمليات الدفع الإلكتروني تحدث كل ثانية. أي خاصية؟", "a": ["السرعة Velocity", "القيمة Value", "الصحة Veracity", "التنوع Variety"], "c": 0, "why": "سرعة الإنتاج والمعالجة."}, {"q": "بيانات تحتوي نصوصًا وصورًا وفيديو وجداول. أي خاصية؟", "a": ["التنوع Variety", "الحجم Volume", "السرعة Velocity", "القيمة Value"], "c": 0, "why": "اختلاف أنواع البيانات."}, {"q": "وجدنا أن بعض البيانات فيها أخطاء وغير دقيقة. أي خاصية؟", "a": ["الصحة Veracity", "السرعة Velocity", "الحجم Volume", "التنوع Variety"], "c": 0, "why": "الموثوقية والجودة."}, {"q": "كمية هائلة من البيانات تجمعها الأجهزة الذكية. أي خاصية؟", "a": ["الحجم Volume", "الصحة Veracity", "القيمة Value", "السرعة Velocity"], "c": 0, "why": "الكمية الضخمة."}, {"q": "الفائدة الفعلية التي نستخلصها من تحليل البيانات هي:", "a": ["القيمة Value", "التنوع Variety", "الحجم Volume", "السرعة Velocity"], "c": 0, "why": "ما الفائدة التي حصلنا عليها؟"}]}, {"type": "match", "title": "المستوى 3 • اربط واكسب", "q": "اربط كل عنصر بما يناسبه", "rounds": [[["IoT", "ساعة ذكية تقيس ضربات القلب"], ["التواصل الاجتماعي", "صورة منشورة على إنستغرام"], ["البيانات المالية", "شراء ببطاقة ائتمان"], ["الجغرافية", "خرائط تجمع حركة المرور"], ["الحكومية", "تعداد السكان"]], [["هيكلية", "بيانات عملاء في جدول"], ["غير هيكلية", "منشور فيسبوك بصور وفيديو"], ["شبه هيكلية", "رسالة بريد إلكتروني"]]]}, {"type": "mcq", "title": "المستوى 4 • 🔥 تحدي الخبراء", "n": 8, "items": [{"q": "متجر يسجل ملايين عمليات الشراء كل يوم بشكل لحظي ويريد تقليل أخطاء التسجيل. أي خصائص تظهر هنا؟", "a": ["الحجم والسرعة والصحة", "الصحة فقط", "التنوع فقط", "القيمة فقط"], "c": 0, "why": "كمية كبيرة وتدفق سريع وحاجة لدقة."}, {"q": "مجموعة بيانات: جدول مبيعات + تسجيلات صوتية + منشورات تواصل. أي خاصية تعبر عنها بوضوح؟", "a": ["التنوع Variety", "السرعة Velocity", "القيمة Value", "الحجم Volume"], "c": 0, "why": "اختلاف أنواع البيانات."}, {"q": "إحصاءات منشورة بلا مصدر على صورة في السوشيال ميديا، أي خاصية مهددة؟", "a": ["الصحة Veracity", "الحجم Volume", "السرعة Velocity", "التنوع Variety"], "c": 0, "why": "لا يمكن الوثوق بدقتها."}, {"q": "أي مما يلي مثال على بيانات شبه هيكلية؟", "a": ["رسالة بريد إلكتروني (مرسل ومستلم وتاريخ + نص حر)", "جدول درجات الطلاب", "فيديو منشور", "تسجيل صوتي"], "c": 0, "why": "مزيج من حقول منظمة ونص حر."}, {"q": "أي عبارة تعبر عن \"القيمة\" Value؟", "a": ["تحليل بيانات الشراء لمعرفة السلعة الأكثر طلبًا قبل المواسم", "تخزين مليون صورة", "سرعة وصول البيانات", "تنوع الصيغ"], "c": 0, "why": "القيمة هي الفائدة المستخلصة."}, {"q": "لماذا لا يكفي برنامج Excel لمعالجة البيانات الضخمة؟", "a": ["لأن حجمها وتعقيدها وسرعة تدفقها تتجاوز قدرة الأدوات التقليدية", "لأنه لا يحفظ الأرقام", "لأنه لا يعمل على الحاسوب", "لأن البيانات الضخمة قليلة"], "c": 0, "why": "هذا تعريف البيانات الضخمة."}, {"q": "تطبيق خرائط يقترح طريقًا بديلًا خلال ثوانٍ. أبرز خاصيتين في بياناته؟", "a": ["السرعة والحجم", "الصحة والقيمة فقط", "التنوع فقط", "لا توجد"], "c": 0, "why": "بيانات حركة المرور ضخمة وتتحدث لحظيًا."}, {"q": "ساعة ذكية + تطبيق خرائط + بطاقة دفع: أي مصادر تمثل؟", "a": ["IoT + جغرافية + مالية", "حكومية فقط", "تواصل اجتماعي فقط", "لا مصادر"], "c": 0, "why": "لكل منها مصدر مختلف."}]}, {"type": "tf", "title": "المستوى 5 • 🔥 صح أم خطأ للخبراء", "items": [{"q": "البيانات الضخمة هي البيانات الكبيرة الحجم فقط بغض النظر عن تعقيدها.", "c": false, "why": "التعقيد والسرعة والتنوع أساسية."}, {"q": "قاعدة بيانات عملاء في صفوف وأعمدة تعد بيانات هيكلية.", "c": true, "why": "منظمة في جداول."}, {"q": "الصحة Veracity تعني سرعة معالجة البيانات.", "c": false, "why": "تعني الدقة والموثوقية."}, {"q": "الفيديوهات والصور تعد بيانات غير هيكلية.", "c": true, "why": "لا تأتي في جداول منظمة."}, {"q": "قد تكون قيمة البيانات ضعيفة إذا لم تُحلل وتُستخدم في قرارات.", "c": true, "why": "القيمة تأتي من التحليل والاستخدام."}]}], "mount": "#game", "avatar": "../../../assets/teacher/g2-u1l3.jpg", "avatarFallback": "../../../assets/teacher/base.jpg"})</script></body></html>
