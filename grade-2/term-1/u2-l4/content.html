<!doctype html><html lang="ar" dir="rtl"><head><script src="../../../assets/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء موقعك الإلكتروني بمساعدة الذكاء الاصطناعي | Techora</title><link rel="icon" href="../../../assets/logo.svg"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../../../firebase-config.js"></script><script src="../../../auth-core.js"></script><script src="../../../techora-config.js"></script><script src="../../../assets/data.js"></script><script src="../../../auth-guard.js" data-root="../../../"></script><link rel="stylesheet" href="../../../assets/lesson.css"></head><body><div class="top"><a href="../../../grade-2/term-1.html">→ دروس الفصل الأول</a><span class="t">الوحدة الثانية • الدرس الرابع • المحتوى</span><a href="../../../index.html">Techora ⌂</a></div><main class="wrap" id="app"></main><script src="../../../assets/lesson.js"></script><script>TLesson.render({"title": "إنشاء موقعك الإلكتروني بمساعدة الذكاء الاصطناعي", "pages": "ص ٧٩ – ٩٣", "unit": "الوحدة الثانية • تصميم وإنشاء مواقع الويب", "intro": "بدل ما تكتب أكوادًا كتير، اشرح فكرتك للذكاء الاصطناعي وهو يبني لك الموقع في دقائق!", "goals": ["أصمم صفحتي على شبكة الإنترنت.", "أمارس خطوات إنشاء المواقع البسيطة بأداة ذكاء اصطناعي مجانية.", "أطوّر صفحتي على شبكة الإنترنت."], "summary": "بدل كتابة HTML وCSS يكفي أن تكتب <b>Prompts</b> واضحة ومحددة للذكاء الاصطناعي (النوع ← التصميم والألوان ← الصفحات ← المحتوى ← الصور ← التواصل)، ثم تعدّل وتخصص. وتذكّر: <b>الخصوصية والأمان أولًا</b>.", "sections": [{"type": "act", "k": "🗣️ لنتفاعل معًا", "t": "كيف يمكن إنشاء موقع إلكتروني؟ وما دور الذكاء الاصطناعي في ذلك؟", "gold": false}, {"type": "text", "t": "في الدرس السابق صممت موقع مدرستك بـ HTML وCSS، وكل تعديل يحتاج أوامر أكثر ووقتًا أكبر. أما الآن فالذكاء الاصطناعي وفّر أدوات ومواقع تنشئ وتنسق وتعدّل المواقع بسهولة، وكل ما عليك أن تخبره بما تريد. وهكذا يصبح موقعك <b>نافذة رقمية</b> تعرض أفكارك وهواياتك ومشروعك المدرسي للعالم."}, {"type": "act", "k": "💬 نشاط جماعي", "t": "هل إنشاء موقع ويب أمر معقد ويحتاج مهارات برمجية متقدمة؟ ولماذا نحتاج إلى موقع إلكتروني؟", "gold": false}, {"type": "cards", "items": [["🎤", "منصة للتعبير عن نفسك", "لعرض هواياتك ومواهبك وإنجازاتك بطريقة إبداعية."], ["🌍", "التواصل مع العالم", "مشاركة أفكارك مع من يشاركونك اهتماماتك."], ["🧠", "تطوير مهارات المستقبل", "مهارات رقمية مهمة لدراستك وحياتك المهنية."], ["🏫", "عرض المشاريع المدرسية", "منصة احترافية وجذابة لمشاريعك وأبحاثك."]], "h": "لماذا نحتاج موقعًا إلكترونيًا؟"}, {"type": "cards", "items": [["💬", "يفهم الأوامر البسيطة", "ويحولها إلى تصميم احترافي."], ["⏱️", "يوفر الوقت والجهد", "دون تعلم لغات برمجة معقدة."], ["💡", "يقترح أفكارًا وتصميمات", "تناسب موضوع موقعك."], ["🛠️", "يعدّل بسرعة", "حسب ملاحظاتك."]], "h": "ماذا يفعل الذكاء الاصطناعي لك؟", "l": "قبل الذكاء الاصطناعي كان إنشاء موقع يتطلب تعلم HTML وCSS وJavaScript، واليوم يمكن إنشاء مواقع احترافية في دقائق."}, {"type": "cards", "items": [["🌐", "Wegic (wegic.ai)", "يولّد مواقع من معلومات بسيطة، سهل الاستخدام، يعمل من الهاتف، تصميم عصري ولا يحتاج مهارات تقنية. وله خطة مجانية مناسبة للطلاب."], ["🐬", "Jimdo Dolphin (jimdo.com)", "أداة تنشئ مواقع بناءً على أوامرك وتفضيلاتك، بواجهة سهلة وخيارات تصميم متنوعة."]], "h": "أدوات الذكاء الاصطناعي لإنشاء المواقع", "l": "خطوات العمل تنطبق على الأدوات المشابهة، وقد تتغير الأدوات والواجهات مع الوقت، فالمهم فهم الفكرة."}, {"type": "text", "h": "ما هو الـ Prompt؟", "t": "<b>Prompt</b> هو الأمر النصي الذي نكتبه لأداة الذكاء الاصطناعي. كلما كان <b>واضحًا ومحددًا</b> كانت النتيجة أفضل. بدل \"أنشئ موقعًا لكرة القدم\" اكتب: <b>\"أنشئ موقعًا لنادي كرة القدم المدرسي يعرض مباريات الفريق وصوره وجدول المسابقات\"</b>."}, {"type": "steps", "h": "خطوات إنشاء الموقع (مثال: موقع نادي القراءة)", "l": "سجّل حسابًا بالبريد الإلكتروني، ثم \"ابدأ الآن\" واختر Build your site. وبعد ذلك اكتب Prompts:", "items": [["١) نوع الموقع", "\"قم بإنشاء موقع إلكتروني لنادي القراءة الخاص بي في المدرسة. يجب أن يكون بسيطًا وجذابًا لطالب عمره 13 عامًا، اسم النادي School Read Club.\" (سيسألك عن اسم الموقع بالإنجليزية ونوع المحتوى)"], ["٢) التصميم والألوان", "\"اجعل التصميم عصريًا، واستخدم الأزرق والأبيض كألوان رئيسية، وأريده مناسبًا لطالب عمره 13 عامًا.\""], ["٣) الصفحات الأساسية", "\"أضف صفحة رئيسية، وصفحة من نحن، وصفحة أنشطتنا، وصفحة اتصل بنا.\""], ["٤) المحتوى", "\"أضف صفحة من نحن تشرح أن الموقع لنادي القراءة في مدرستي، ونجتمع أسبوعيًا لمناقشة الكتب.\""], ["٥) معرض الصور", "\"أضف قسمًا للصور بشكل شبكة جميلة يتيح للزائر النقر على الصورة لرؤيتها بحجم أكبر.\""], ["٦) التواصل", "\"أضف نموذج اتصال في صفحة منفصلة تسمى تواصل معنا، مع معلومات النادي ومواعيد الاجتماعات.\""]]}, {"type": "acc", "h": "تفاصيل مهمة في كل خطوة", "items": [["🎨 أنماط التصميم وأفكار الألوان", "أنماط: <b>عصري</b> (بسيط وأنيق)، <b>مرح</b> (ألوان زاهية وعناصر متحركة)، <b>احترافي</b> (أنيق وهادئ)، <b>إبداعي</b> (غير تقليدي). ألوان: أزرق وأخضر وأبيض / بنفسجي ووردي وأبيض فاتح / أسود وذهبي وأبيض. اختر 2–3 ألوان متناغمة كحد أقصى، فالألوان المتضاربة تجعل الموقع صعب القراءة ومزعجًا."], ["📄 الصفحات المقترحة", "الرئيسية (نظرة عامة وترحيب)، من نحن (معلومات عنك أو مشروعك)، المدونة/المقالات (أفكارك)، معرض الصور، اتصل بنا (طرق التواصل)."], ["🖼️ أنواع معارض الصور", "<b>شبكي Grid</b> صور متساوية في شبكة، <b>عرض شرائح Slideshow</b> صور متحركة تظهر واحدة تلو الأخرى، <b>Masonry</b> أحجام مختلفة متداخلة، <b>Lightbox</b> تُفتح كبيرة عند النقر. (الصور الافتراضية يمكن استبدالها بصورك)."], ["📬 معلومات الاتصال", "نموذج اتصال، البريد الإلكتروني (بإذن معلمك ووالديك)، روابط حسابات التواصل، رمز QR يقود لموقعك. <b>تنبيه أمان:</b> استخدم معلومات اتصال آمنة وبإذن، واستشر والديك أو معلمك قبل إضافة بيانات حقيقية."], ["✏️ تخصيص وتعديل الموقع", "انقر على أي نص لتعديله، أو اطلب: \"عدّل هذا النص ليكون أكثر حماسًا وليناسب طلاب الإعدادية\". غيّر الألوان: \"غيّر لون العناوين إلى الأخضر الفاتح والخلفية إلى البيج\". استبدل الصور بصورك بعد إذن المعلم: \"استبدل هذه الصورة بصورة تظهر فيها مجموعة طلاب يقرؤون\"."]]}, {"type": "cards", "items": [["✨", "البساطة", "تصميم بسيط ومنظم أجذب وأسهل في الاستخدام."], ["📱", "توافق مع الهواتف", "معظم الناس يتصفحون عبر هواتفهم."], ["🔐", "الخصوصية والأمان", "لا تنشر العنوان أو رقم الهاتف علنًا، واستخدم نموذج اتصال."], ["🌱", "التحديث المستمر", "الموقع مثل الحديقة يحتاج رعاية وتحديثًا منتظمًا."], ["🌗", "تباين جيد", "وضوح النص أمام الخلفية وخطوط سهلة القراءة."], ["➕", "أفكار لتحسينه", "شعار مخصص، جدول مواعيد، فيديوهات قصيرة، روابط مفيدة."]], "h": "نصائح لموقع ويب ناجح"}, {"type": "act", "k": "🚀 مشروعك", "t": "خطط لموقعك: ما موضوعه؟ ما الصفحات؟ ما الألوان؟ ما نوع المحتوى (نصوص، صور، فيديو)؟ ومن الزوار المتوقعون؟ ثم أنشئه بأداة ذكاء اصطناعي، وراجع النتائج، وأعرضه على زملائك واطلب ملاحظات إيجابية واقتراحات للتطوير.", "gold": false}, {"type": "act", "k": "⚠️ مهم", "t": "احصل على موافقة معلمك ووالديك قبل نشر أي معلومات شخصية عبر الإنترنت. الأمان والخصوصية أولًا!", "gold": true}, {"type": "text", "h": "أفكار لمشاريع مستقبلية", "t": "موقع لمجلة مدرسية إلكترونية • منصة لمشاركة مشاريع الفصل • معرض فني رقمي للمدرسة • مدونة علمية للمشاريع والتجارب."}], "pdf": "https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Prepratory/Prepratory2/Term1/StudentBook/ICT_ARABIC_Prp2_TR1.pdf", "key": "g2-u2l4", "say": "اكتب الفكرة وهو يبني الموقع! ✨", "root": "../../../"})</script></body></html>
