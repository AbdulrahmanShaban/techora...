<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم | Techora</title><link rel="icon" href="assets/logo.svg">
<script src="assets/theme.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="auth-core.js"></script><script src="techora-config.js"></script><script src="assets/data.js"></script><script src="auth-guard.js" data-root=""></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;line-height:1.7;background:var(--bg);color:var(--text)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(4vw,14px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top a,.top button{color:var(--accent);text-decoration:none;font-weight:800;font-size:14px;background:none;border:0;font-family:inherit;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:18px max(4vw,14px) 90px;display:grid;gap:16px}
.card{padding:18px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel))}
.card h2{margin:0 0 12px;font-size:18px}
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pic{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--green);background:var(--panel);display:grid;place-items:center;font-size:32px;font-weight:900;color:var(--accent);flex:none;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.prof h1{margin:0;font-size:22px}.prof small{color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.big{font-size:38px;font-weight:900;color:var(--accent);line-height:1.1}
.bar{height:10px;border-radius:9px;background:color-mix(in srgb,var(--text) 10%,transparent);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--mint));border-radius:9px;transition:width .6s}
.muted{color:var(--muted);font-size:13px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{padding:12px;border-radius:16px;border:1px solid var(--line);text-align:center;background:color-mix(in srgb,var(--text) 3%,transparent)}
.bd .i{font-size:30px}.bd b{display:block;font-size:14px}.bd small{color:var(--muted);font-size:12px;display:block}
.bd.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}.bd.off{opacity:.62}.bd.off .i{filter:grayscale(1)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:right;color:var(--accent);padding:8px;background:color-mix(in srgb,var(--green) 12%,transparent)}td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;font-size:14px}.ch.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent)}
.pill{font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}.ch.ok .pill{background:var(--green);color:var(--on-green);border-color:var(--green)}
.act{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.act:first-of-type{border-top:0}.act span{flex:1}.act em{font-style:normal;color:var(--accent);font-weight:800;white-space:nowrap}
.btn{display:inline-block;padding:12px 22px;border-radius:14px;background:var(--green);color:var(--on-green);font-weight:900;text-decoration:none;font-size:16px}
.empty{padding:16px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);text-align:center;font-size:14px}
.err{color:var(--bad);font-weight:700}
</style></head><body>
<div class="top"><a href="index.html">→ الرئيسية</a><b>📊 لوحة التحكم</b><button onclick="techoraLogout()">خروج</button></div>
<main class="wrap" id="app"><div class="card empty">جارٍ تحميل بياناتك…</div></main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dt(t){try{var d=t&&t.toDate?t.toDate():new Date(t);return d.toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})}catch(e){return''}}
function render(d){
 var u=TA.auth.currentUser,s=d.stats,L=TData.level(s.xp),total=TData.CAT.length,pct=Math.round(s.done/total*100),name=u.displayName||d.user.displayName||u.email||'طالب';
 var h='<section class="card prof"><div class="pic">'+(u.photoURL?'<img src="'+esc(u.photoURL)+'" alt="">':esc(name.trim().charAt(0)))+'</div><div><h1>أهلًا '+esc(name)+' 👋</h1><small>'+esc(u.email||'')+'</small></div></section>';
 h+='<div class="grid"><section class="card"><h2>⚡ نقاط الخبرة</h2><div class="big">'+s.xp+' <small class="muted">XP</small></div><div class="muted">إجمالي ما جمعته من الدروس والألعاب</div></section>';
 h+='<section class="card"><h2>🎚 المستوى '+L.n+'</h2><div class="bar"><i style="width:'+L.pct+'%"></i></div><div class="muted">'+(s.xp-L.from)+' / '+(L.to-L.from)+' XP للمستوى '+(L.n+1)+' — باقي '+(L.to-s.xp)+' XP</div></section>';
 h+='<section class="card"><h2>📚 التقدم التعليمي</h2><div class="big">'+pct+'<small class="muted">%</small></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="muted">'+s.done+' من '+total+' دروس مكتملة</div></section></div>';
 // متابعة التعلم
 var next=null,ll=d.user.lastLesson;
 if(ll&&ll.path){var c0=TData.CAT.filter(function(c){return c.path===ll.path})[0];next={t:ll.title,href:ll.path+(c0&&d.progress[c0.id]&&d.progress[c0.id].completed?'activity.html':'content.html'),tag:'آخر درس فتحته'}}
 if(!next||(function(){var c=TData.CAT.filter(function(c){return c.path===ll.path})[0];return c&&d.progress[c.id]&&d.progress[c.id].completed})()){var n=TData.CAT.filter(function(c){return!(d.progress[c.id]&&d.progress[c.id].completed)})[0];if(n)next={t:n.title,href:n.path+'content.html',tag:'الدرس المقترح'}}
 h+='<section class="card"><h2>▶ متابعة التعلم</h2>'+(next?'<p class="muted" style="margin:0 0 10px">'+next.tag+': <b style="color:var(--text)">'+esc(next.t)+'</b></p><a class="btn" href="'+next.href+'">كمّل من حيث وقفت ←</a>':'<div class="empty">🎉 أكملت كل الدروس المتاحة. ممتاز!</div>')+'</section>';
 // إنجازات
 var got=TData.BADGES.filter(function(b){return d.ach[b.id]}),lock=TData.BADGES.filter(function(b){return!d.ach[b.id]});
 h+='<section class="card"><h2>🏆 الإنجازات ('+got.length+' / '+TData.BADGES.length+')</h2>'+(got.length?'<div class="badges">'+got.map(function(b){return'<div class="bd on"><div class="i">'+b.icon+'</div><b>'+b.t+'</b><small>'+b.d+'</small><small>'+dt(d.ach[b.id].earnedAt)+'</small></div>'}).join('')+'</div>':'<div class="empty">لسه مفيش إنجازات. أكمل أول درس والعب اللعبة لتحصل على أول شارة!</div>')+'</section>';
 h+='<section class="card"><h2>🔒 إنجازات مقفلة</h2>'+(lock.length?'<div class="badges">'+lock.map(function(b){return'<div class="bd off"><div class="i">'+b.icon+'</div><b>'+b.t+'</b><small>'+b.d+'</small></div>'}).join('')+'</div>':'<div class="empty">فتحت كل الإنجازات 👑</div>')+'</section>';
 // نتائج
 h+='<section class="card"><h2>📝 نتائج الاختبارات</h2>'+(d.results.length?'<div class="tw"><table><tr><th>الدرس</th><th>الدرجة</th><th>النسبة</th><th>النجوم</th><th>التاريخ</th></tr>'+d.results.map(function(r){return'<tr><td>'+esc(r.title)+'</td><td>'+r.right+' / '+r.total+'</td><td>'+r.pct+'%</td><td>'+'⭐'.repeat(r.stars)+'</td><td>'+dt(r.at)+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">لسه ما لعبتش أي اختبار. ابدأ بلعبة أي درس.</div>')+'</section>';
 // تحديات
 var ch=TData.CAT.map(function(c){var p=d.progress[c.id];return{c:c,ok:p&&p.stars===3,p:p}});
 h+='<section class="card"><h2>🔥 التحديات (إتقان الدرس: 3 نجوم)</h2><div class="muted" style="margin-bottom:8px">مكتمل '+ch.filter(function(x){return x.ok}).length+' من '+ch.length+'</div>'+ch.map(function(x){return'<div class="ch'+(x.ok?' ok':'')+'"><span>'+(x.c.grade==='g1'?'أولى إعدادي':'تانية إعدادي')+' • '+esc(x.c.title)+'</span><span class="pill">'+(x.ok?'✓ مكتمل':x.p?(x.p.stars+' / 3 ⭐'):'لم يبدأ')+'</span></div>'}).join('')+'</section>';
 // نشاط
 h+='<section class="card"><h2>🕘 سجل النشاط</h2>'+(d.activity.length?d.activity.map(function(a){return'<div class="act"><span>'+esc(a.title)+'<br><small class="muted">'+dt(a.at)+'</small></span>'+(a.xp?'<em>+'+a.xp+' XP</em>':'')+'</div>'}).join(''):'<div class="empty">سجل نشاطك فاضي لحد دلوقتي.</div>')+'</section>';
 $('app').innerHTML=h}
function go(){TA.auth.onAuthStateChanged(function(u){if(!u)return;TData.syncBadges().then(function(){return TData.load()}).then(render).catch(function(e){console.warn(e);$('app').innerHTML='<div class="card"><p class="err">تعذّر تحميل بياناتك.</p><p class="muted">تأكد من نشر قواعد Firestore وتفعيل Cloud Firestore في مشروع Firebase (راجع SETUP-DASHBOARD.md)، ثم أعد تحميل الصفحة.</p></div>'})})}
go()})();
</script></body></html>
