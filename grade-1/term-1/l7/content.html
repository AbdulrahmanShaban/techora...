ستخدمتها؟", "gold": false}, {"type": "text", "h": "١) ما Google Meet؟", "t": "عرفت في الدروس السابقة <b>أدوات التعاون والتواصل المباشر</b> لإجراء مكالمات فيديو ومؤتمرات عبر الإنترنت لتبادل البيانات والأفكار وإنتاج المشروعات. ومن أمثلتها <b>Google Meet</b>، خدمة مؤتمرات الفيديو من جوجل التي تتيح <b>مكالمات فيديو جماعية، ومشاركة الشاشات، والدردشة، والتعاون في الوقت الفعلي</b>. ولاستخدامها يجب أن يكون لديك <b>حساب جوجل</b> (أنشأته في الدرس الخامس)."}, {"type": "cards", "h": "٢) كيف تصل إلى Google Meet؟", "items": [["💻", "من الكمبيوتر", "عبر الرابط <span dir=\"ltr\">https://meet.google.com</span>."], ["📱", "على أندرويد", "تنزيل التطبيق من متجر Google Play."], ["🧩", "من أيقونة تطبيقات جوجل", "تشغيل البرنامج من قائمة تطبيقات جوجل."]]}, {"type": "acc", "h": "٣) إنشاء اجتماع", "items": [["⚡ اجتماع فوري", "<div class=\"flow\"><div class=\"step\"><b>1</b><p>انتقل إلى الصفحة الرئيسية لتطبيق Google Meet.</p></div><div class=\"step\"><b>2</b><p>اضغط <b>اجتماع جديد New meeting</b> ثم <b>بدء اجتماع فوري</b>.</p></div><div class=\"step\"><b>3</b><p>اضغط أيقونة <b>نسخ</b> لمشاركة رابط الاجتماع.</p></div><div class=\"step\"><b>4</b><p>أرسل الرابط للمشاركين عبر البريد الإلكتروني أو WhatsApp.</p></div></div>"], ["🗓️ اجتماع لوقت لاحق", "اتبع نفس الخطوات ثم انقر <b>إنشاء اجتماع لوقت لاحق</b>، ستظهر نافذة صغيرة بها رابط الجلسة، <b>انسخ الرابط</b> وأرسله لمن تريد دعوتهم واحتفظ به لحين الاجتماع."], ["✅ الموافقة على طلبات الانضمام", "عندما يحاول مدعو الدخول لجلستك يظهر إشعار أعلى الصفحة لتقبل أو ترفض انضمامه."]]}, {"type": "acc", "h": "٤) الانضمام إلى اجتماع", "items": [["🔗 الانضمام برابط", "إذا وصلك رابط لاجتماع فانقر عليه مباشرة. وقد يستغرق الانضمام وقتًا حتى يوافق منظم الاجتماع على طلبك."], ["🔒 قاعدة خصوصية", "إذا دُعيت لاجتماع برابط فلا ترسل الرابط إلى شخص آخر، ويجب استئذان صاحب الاجتماع."]]}, {"type": "cards", "h": "٥) أثناء الاجتماع: خيارات ومميزات", "items": [["🙋", "رفع اليد", "لطلب التحدث بشكل منظم وسلس، وعندما يسمح لك افتح الميكروفون وتحدث."], ["💬", "إرسال رسائل (In call messages)", "للتواصل مع الحضور عبر أيقونة الرسالة أسفل الصفحة."], ["🖥️", "مشاركة العرض Share screen", "مشاركة شاشتك كاملة أو نافذة محددة أو علامة تبويب ثم زر مشاركة."], ["⛔", "إيقاف مشاركة العرض", "انقر Stop sharing عند الانتهاء."]]}, {"type": "acc", "h": "قواعد عامة يجب اتباعها أثناء الاجتماع", "items": [["🤫 الإنصات", "أثناء تحدث أحد المشاركين: أنصت واستمع <b>وأغلق الميكروفون</b>."], ["🙋 رفع اليد", "لا تتحدث في أي وقت، بل ارفع يدك وانتظر الإذن."], ["🔗 الرابط", "لا ترسل رابط الاجتماع لأي شخص دون إذن صاحبه."], ["⏱️ الالتزام", "انضم في الموعد ولا تغادر قبل انتهاء الاجتماع."]]}, {"type": "cards", "items": [["🧑‍🎓", "اسمك الحقيقي", "اكتب اسمك واضحًا ليعرفك المعلم."], ["🔇", "اختبر الصوت قبل الدخول", "ولا تُدخل ضوضاء من حولك."], ["🖼️", "خلفية مناسبة", "ومظهر لائق في الكاميرا."], ["🔐", "احذر الغرباء", "لا تقبل دعوات من مجهولين."]], "h": "آداب إضافية (من خارج الكتاب)"}, {"type": "act", "k": "🎥 نشاط تطبيقي", "t": "أنشئ اجتماعًا مع زميلين: أرسل الرابط، وانضموا، واستخدم رفع اليد ومشاركة الشاشة وأوقفها. ثم لمزيد من الأنشطة ارجع لكراسة الأنشطة (نشاط 1–3).", "gold": false}, {"type": "act", "k": "💡 هل تعلم؟", "t": "Google Meet هو أحد أدوات التواصل المباشر (التفاعل لحظة بلحظة)، على عكس البريد الإلكتروني الذي هو تواصل غير مباشر.", "gold": true}], "pdf": "https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Prepratory/Prepratory1/Term1/StudentBook/ICT_ARABIC_Prp1_TR1.pdf", "key": "g1-l7", "say": "اجتماع فيديو بأدب رقمي: ارفع إيدك قبل ما تتكلم 🙋🎥", "root": "../../../"})</script></body></html>
