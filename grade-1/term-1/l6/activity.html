<!doctype html><html lang="ar" dir="rtl"><head><script src="../../../assets/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لعبة الدرس السادس | Techora</title><link rel="icon" href="../../../assets/logo.svg"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../../../firebase-config.js"></script><script src="../../../auth-core.js"></script><script src="../../../techora-config.js"></script><script src="../../../assets/data.js"></script><script src="../../../auth-guard.js" data-root="../../../"></script><link rel="stylesheet" href="../../../assets/lesson.css"></head><body><div class="top"><a href="../../../grade-1/term-1.html">→ دروس الفصل الأول</a><span class="t">الدرس السادس • اللعبة</span><a href="../../../index.html">Techora ⌂</a></div><main class="wrap"><div id="game"></div></main><script src="../../../assets/game.js"></script><script>TGame.start({"id": "g1t1l6", "title": "صائد السحاب ☁️⚡", "back": "content.html", "levels": [{"type": "mcq", "title": "المستوى 1 • أسئلة الكتاب", "items": [{"q": "تُعرف الحوسبة السحابية بأنها نموذج لتقديم:", "a": ["الخدمات الرقمية عبر الإنترنت", "العروض التقديمية", "Google Docs", "Google Classroom"], "c": 0, "why": "تعريفها الأساسي."}, {"q": "خدمة التخزين الحوسبي هي:", "a": ["تخزين الملفات والمجلدات عبر الإنترنت", "تخزينها محليًا على الجهاز", "مشاركة الملفات وتبادلها", "Google Classroom"], "c": 0, "why": "التخزين عبر الإنترنت."}, {"q": "تُعرف خدمة البرمجيات والتطبيقات عبر الإنترنت بأنها:", "a": ["إتاحة استخدام البرمجيات والتطبيقات عبر الإنترنت", "إتاحتها بدون إنترنت", "مشاركة الملفات محليًا", "خدمة البريد"], "c": 0, "why": "هذا تعريفها."}, {"q": "تُعرف خدمة مشاركة المصادر الإلكترونية بأنها:", "a": ["مشاركة الملفات وتبادلها مع الآخرين عبر شبكة الإنترنت", "التخزين الحوسبي", "مشاركة الملفات محليًا", "مشاركة البريد"], "c": 0, "why": "عبر الإنترنت."}, {"q": "التواصل من مجالات الحوسبة السحابية، ويتم من خلال:", "a": ["البريد الإلكتروني", "التخزين الحوسبي", "البرمجيات والتطبيقات", "Google Sheets"], "c": 0, "why": "Gmail وغيره."}, {"q": "خدمات تخزين الملفات ومشاركتها والوصول إليها في أي وقت ومكان تسمى:", "a": ["التخزين الحوسبي", "البريد الإلكتروني", "البرمجيات والتطبيقات", "Google Sheets"], "c": 0, "why": "Google Drive مثال."}, {"q": "نستخدم برامج معالجة النصوص السحابية مثل:", "a": ["Google Docs", "Google Sheets", "Google Classroom", "Google Cloud Platform"], "c": 0, "why": "Docs للنصوص."}, {"q": "نستخدم جداول البيانات السحابية مثل:", "a": ["Google Sheets", "Google Docs", "Google Classroom", "Google Cloud Platform"], "c": 0, "why": "Sheets للجداول."}, {"q": "نستخدم أدوات التعاون السحابية مثل:", "a": ["Google Classroom", "Google Docs", "Google Sheets", "Google Cloud Platform"], "c": 0, "why": "Classroom للتعاون."}, {"q": "من أشهر موفري خدمات الحوسبة السحابية:", "a": ["Google Cloud Platform", "Google Docs", "Google Sheets", "Google Classroom"], "c": 0, "why": "GCP مزود."}]}, {"type": "order", "title": "المستوى 2 • رتّب مسار البيانات", "items": [{"q": "رتّب خطوات معالجة البيانات وتخزينها سحابيًا", "seq": ["جمع البيانات", "نقل البيانات إلى مراكز البيانات", "معالجة البيانات على الخوادم", "تخزين البيانات", "إدارة البيانات", "الوصول للبيانات عبر الإنترنت"], "why": "هذا هو مسار البيانات في السحابة."}]}, {"type": "match", "title": "المستوى 3 • اربط واكسب", "q": "اربط كل مجال بمثاله", "rounds": [[["التخزين", "Google Drive وOneDrive"], ["معالجة النصوص", "Google Docs"], ["جداول البيانات", "Google Sheets"], ["التعاون التعليمي", "Google Classroom وTeams"], ["البريد", "Gmail وOutlook"]], [["AWS", "Amazon"], ["Azure", "Microsoft"], ["Google Cloud Platform", "Google"]]]}, {"type": "tf", "title": "المستوى 4 • صح أم خطأ؟", "items": [{"q": "الحوسبة السحابية تتيح الدخول لملفاتك من أي مكان به إنترنت.", "c": true, "why": "توافر الخدمة."}, {"q": "تحتاج الحوسبة السحابية دائمًا إلى شراء تراخيص برمجيات باهظة.", "c": false, "why": "تخفض التكاليف."}, {"q": "الاتصال بالإنترنت من متطلبات الحصول على الخدمات السحابية.", "c": true, "why": "شرط أساسي."}, {"q": "يمكن لمنصات التعلم الإلكتروني أن تعمل بالحوسبة السحابية.", "c": true, "why": "من مجالات التعليم."}, {"q": "تُحفظ بيانات الحوسبة السحابية في مراكز بيانات بها خوادم قوية.", "c": true, "why": "صحيح."}, {"q": "لا يلزم وجود حساب لدى موفر الخدمة للاستفادة منها.", "c": false, "why": "يلزم حساب."}]}, {"type": "mcq", "title": "المستوى 5 • 🔥 تحدي الخبراء", "n": 8, "items": [{"q": "طالب كتب مشروعه على جهاز المدرسة ثم تعطل الجهاز. كيف كانت الحوسبة السحابية ستنقذ مشروعه؟", "a": ["لأن الملف محفوظ على الخوادم ويمكن فتحه من أي جهاز", "لأنها تصلح الجهاز", "لأنها تطبع الملف", "لأنها تغلق الحساب"], "c": 0, "why": "التخزين السحابي مستقل عن الجهاز."}, {"q": "لماذا تقلل الحوسبة السحابية التكاليف على المدارس؟", "a": ["لأنها لا تحتاج شراء تراخيص كثيرة ولا أجهزة عالية المواصفات", "لأنها مجانية دائمًا دون استثناء", "لأنها تلغي الإنترنت", "لأنها تغلق الأجهزة"], "c": 0, "why": "كما ورد في الفوائد."}, {"q": "شاركت ملفًا مع زميلك وأردت ألا يتمكن من تعديله. ماذا تفعل؟", "a": ["تمنحه حق العرض فقط", "تمنحه حق التعديل", "تنشر رابطًا عامًا", "تحذف الملف"], "c": 0, "why": "ضبط الأذونات."}, {"q": "أي مما يلي مثال على \"خدمة برمجيات عبر الإنترنت\"؟", "a": ["فتح Google Docs من المتصفح وكتابة مستند", "تثبيت برنامج من قرص", "طباعة ورقة", "تشغيل الراديو"], "c": 0, "why": "البرنامج يعمل عبر المتصفح."}, {"q": "لماذا تُعد الخدمات المصرفية الإلكترونية مثالًا على السحابة؟", "a": ["لأن بيانات الحسابات تُعالج وتُحفظ على خوادم تُدخل إليها عبر الإنترنت", "لأنها تعمل دون إنترنت", "لأنها تطبع النقود", "لأنها لا تحتاج حسابًا"], "c": 0, "why": "تعتمد على خوادم وإنترنت."}, {"q": "ما أول متطلب لا غنى عنه لاستخدام Google Drive؟", "a": ["حساب جوجل واتصال بالإنترنت", "طابعة", "قرص مضغوط", "ماسح ضوئي"], "c": 0, "why": "متطلبات الخدمة."}, {"q": "أي سلوك يقلل خطر ضياع ملفاتك المهمة؟", "a": ["حفظ نسخة احتياطية في أكثر من مكان", "حفظها في مكان واحد فقط", "حذف النسخ القديمة فورًا", "عدم استخدام الإنترنت"], "c": 0, "why": "النسخ الاحتياطي حماية."}, {"q": "البريد الإلكتروني يُعد من أدوات الحوسبة السحابية لأن:", "a": ["رسائله مخزنة على خوادم الإنترنت ويمكن الوصول إليها من أي جهاز", "يعمل بدون خادم", "يُخزن في ورقة", "يحتاج قرصًا"], "c": 0, "why": "تخزين عبر الإنترنت."}]}, {"type": "tf", "title": "المستوى 6 • 🔥 صح أم خطأ للخبراء", "items": [{"q": "إذا انقطع الإنترنت تمامًا قد لا تتمكن من الوصول لملفاتك السحابية.", "c": true, "why": "الاتصال شرط."}, {"q": "يمكن لمشاركة ملف على Google Drive أن تكون بحق التعديل أو العرض فقط.", "c": true, "why": "ضبط الأذونات."}, {"q": "الحوسبة السحابية تعني تخزين الملفات على قرص الكمبيوتر فقط.", "c": false, "why": "التخزين عبر الإنترنت."}, {"q": "Google Cloud Platform من موفري الخدمات السحابية.", "c": true, "why": "مثل AWS وAzure."}]}], "mount": "#game", "avatar": "../../../assets/teacher/g1-l6.jpg", "avatarFallback": "../../../assets/teacher/base.jpg"})</script></body></html>
