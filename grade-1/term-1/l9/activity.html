مصدر."}, {"q": "ما الفرق بين النموذج والاستعلام؟", "a": ["النموذج للإدخال والتعديل والاستعلام لجلب بيانات بشروط", "هما نفس الشيء", "النموذج للحذف فقط", "الاستعلام يغلق القاعدة"], "c": 0, "why": "لكل منهما وظيفة."}]}, {"type": "mcq", "title": "المستوى 5 • 🔥 تحدي الخبراء", "n": 8, "items": [{"q": "تريد أسماء الطلاب الحاصلين على أكثر من 18 في الإنجليزي فقط. ماذا تفعل؟", "a": ["تضع الشرط (&gt;18) في Criteria تحت حقل درجة الإنجليزي ثم Run", "تحذف الجدول", "تنشئ نموذجًا", "تغلق Access"], "c": 0, "why": "المعايير للتصفية."}, {"q": "أخفيت حقل درجة الكمبيوتر بإزالة علامة Show. ماذا حدث للبيانات الأصلية؟", "a": ["لم تُحذف، فقط لم تظهر في نتيجة الاستعلام", "حُذفت من الجدول", "حُذف الجدول", "تغيرت الدرجات"], "c": 0, "why": "الإخفاء للنتيجة فقط."}, {"q": "طالب أدخل بيانات من النموذج، أين تجدها؟", "a": ["في جدول \"درجات الطلاب\"", "في Word", "لا تُحفظ", "في الاستعلام فقط"], "c": 0, "why": "النموذج واجهة لنفس الجدول."}, {"q": "لماذا يُفضَّل Query Design في الدرس؟", "a": ["لأنه يمنح تحكمًا أكبر في تفاصيل الاستعلام", "لأنه يحذف الحقول", "لأنه أسرع في الطباعة", "لأنه الوحيد الموجود"], "c": 0, "why": "كما ورد."}, {"q": "إذا تطابق سجل مع جميع المعايير في الشبكة فماذا يحدث؟", "a": ["يظهر في نتائج الاستعلام", "يُحذف", "يُخفى", "يتغير اسمه"], "c": 0, "why": "شرط الظهور."}, {"q": "أي من التالي مثال على استعلام؟", "a": ["عرض أسماء طلاب حصلوا على أكثر من 18 في الإنجليزي", "إدخال درجات طالب", "طباعة الجدول", "حفظ القاعدة"], "c": 0, "why": "جلب بيانات بشروط."}, {"q": "أين تظهر نتيجة الاستعلام بعد Run؟", "a": ["على هيئة جدول", "على هيئة نموذج", "على هيئة صورة", "لا تظهر"], "c": 0, "why": "جدول نتيجة."}, {"q": "ما فائدة جزء التنقل Navigation Pane في إنشاء النموذج؟", "a": ["تحديد الجدول الذي سيُبنى منه النموذج", "حفظ الملف", "طباعة الجدول", "تغيير اللغة"], "c": 0, "why": "نختار الجدول منه."}]}, {"type": "tf", "title": "المستوى 6 • 🔥 صح أم خطأ للخبراء", "items": [{"q": "الاستعلام يُستخدم لتغيير شكل البيانات الأصلية في الجدول.", "c": false, "why": "يجلب فقط حسب الشروط."}, {"q": "يمكن عرض سجل واحد فقط في كل مرة داخل النموذج مع التنقل بين السجلات.", "c": true, "why": "Next / Last / First."}, {"q": "أي سجل يحقق جميع المعايير يظهر في النتيجة.", "c": true, "why": "صحيح."}, {"q": "لا يمكن للاستعلام أن يعرض بعض الحقول فقط.", "c": false, "why": "يمكن إخفاء الحقول."}]}], "mount": "#game", "avatar": "../../../assets/teacher/g1-l9.jpg", "avatarFallback": "../../../assets/teacher/base.jpg"})</script></body></html>
