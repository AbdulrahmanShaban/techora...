 "h": "١) مفهوم التكنولوجيا الخضراء", "t": "يُطلق عليها أحيانًا <b>التكنولوجيا المستدامة</b> أو <b>التكنولوجيا النظيفة</b>. فكرتها الاعتماد على <b>أدوات تكنولوجية</b> تساهم في <b>الحفاظ على البيئة</b> وعدم الإضرار بها، و<b>ترشيد استهلاك مواردها</b>."}, {"type": "cards", "l": "مثال من مصر: اهتمت مصر مؤخرًا باستخدام السيارات الكهربائية بدل السيارات التي تعمل بالوقود، لتقليل الانبعاثات الضارة من العوادم وتقليل استخدام الوقود. وتعمل السيارة الكهربائية بالبطاريات، وبها مكان للشحن يوصلها بمصدر خارجي للكهرباء.", "items": [["⛽", "سيارة بالوقود", "عوادم ضارة واستهلاك للوقود."], ["🔋", "سيارة كهربائية", "انبعاثات أقل ولا تحتاج وقودًا، وتُشحن من الكهرباء."]]}, {"type": "acc", "h": "٢) مجالات استخدام التكنولوجيا الخضراء", "l": "اضغط على كل مجال:", "items": [["☀️ الطاقة المتجددة (Renewable Energy)", "<div class=\"tri\"><div><b>طاقة الشمس:</b> ألواح شمسية تحوّل ضوء الشمس إلى كهرباء.</div><div><b>طاقة الرياح:</b> توربينات رياح تولّد الكهرباء من حركة الهواء.</div><div><b>الطاقة المائية:</b> سدود تولّد الكهرباء من حركة الماء.</div><div><b>الطاقة الحرارية الأرضية:</b> حرارة باطن الأرض لتوليد الكهرباء.</div><div><b>الطاقة الحيوية:</b> مواد عضوية مثل نباتات الصويا والذرة لتوليد الطاقة.</div></div>"], ["💡 ترشيد استهلاك الطاقة", "<div class=\"tri\"><div><b>المباني الخضراء:</b> تصميمها بمواد صديقة للبيئة وموفرة للطاقة مع تحسين التهوية والعزل.</div><div><b>أجهزة موفرة للطاقة</b> وحواسيب عالية الكفاءة.</div><div><b>النقل الذكي:</b> مركبات كهربائية لتحسين كفاءة استخدام الطاقة في النقل.</div></div>"], ["♻️ إدارة النفايات (Recycling)", "<div class=\"tri\"><div>إعادة تدوير الورق والبلاستيك والمعادن إلى منتجات جديدة.</div><div>تحويل النفايات العضوية إلى سماد غني بالمغذيات لتحسين خصوبة التربة.</div><div>تقليل النفايات بإعادة الاستخدام وإصلاح المنتجات.</div></div>"], ["💧 معالجة المياه (Water Treatment)", "<div class=\"tri\"><div>تنقية المياه الملوثة لإعادة استخدامها أو شربها.</div><div>أنظمة ري ذكي موفرة للمياه مثل <b>الري بالتنقيط</b>.</div><div>إصلاح تسريبات المياه واستخدام أجهزة موفرة للمياه.</div></div>"]]}, {"type": "table", "h": "مقارنة سريعة بين مصادر الطاقة المتجددة", "head": ["المصدر", "ما الذي نستغله؟", "الأداة"], "rows": [["الشمس", "ضوء الشمس", "ألواح شمسية"], ["الرياح", "حركة الهواء", "توربينات رياح"], ["الماء", "حركة المياه", "سدود"], ["باطن الأرض", "الحرارة الجوفية", "محطات حرارية أرضية"], ["المواد العضوية", "نباتات كالذرة والصويا", "محطات طاقة حيوية"]]}, {"type": "cards", "h": "٣) فوائد التكنولوجيا الخضراء", "items": [["🌍", "الحفاظ على البيئة من التغيرات المناخية", "عوادم السيارات زادت من ثاني أكسيد الكربون في الغلاف الجوي وزادت الاحتباس الحراري، فظهرت وسائل مواصلات مثل السيارات الكهربائية التي تقلل ثاني أكسيد الكربون والتلوث."], ["🚰", "الحفاظ على الموارد (المياه والكهرباء)", "بأجهزة الاستشعار في صنابير المياه (تشغيل عند وجود اليد وإيقاف عند غيابها) وفي المصابيح، وبالطاقة الشمسية التي تحوّل الضوء لكهرباء وتعمل آليًا وقت الحاجة."]]}, {"type": "steps", "h": "٤) كيف يعمل جهاز الاستشعار (الحساس)؟", "l": "مثال: صنبور المياه الذكي", "items": [["الاكتشاف", "الحساس يلاحظ وجود جسم (يدك) تحت الصنبور."], ["الإشارة", "يرسل إشارة إلكترونية للنظام."], ["التنفيذ", "يفتح الماء ليتدفق وقت الحاجة فقط."], ["الإيقاف", "عند إبعاد اليد يغلق الماء تلقائيًا فيُوفَّر الاستهلاك."]]}, {"type": "cards", "items": [["🌡️", "ضبط درجات الحرارة", "يشغّل التكييف أو التدفئة حسب الحاجة."], ["💡", "تشغيل الأضواء بطرق مختلفة", "تضيء عند وجود حركة وتنطفئ عند غيابها."], ["🔥", "اكتشاف دخان الحرائق", "ينذر مبكرًا لحماية الأرواح."]], "h": "استخدامات الحساسات Sensors"}, {"type": "cards", "h": "قاعدة 3Rs لتقليل النفايات (معلومة إضافية)", "items": [["⬇️", "Reduce قلّل", "اشترِ وأنتج أقل."], ["🔁", "Reuse أعد الاستخدام", "استخدم الأشياء أكثر من مرة وأصلحها."], ["♻️", "Recycle دوّر", "حوّل المخلفات إلى منتجات جديدة."]]}, {"type": "act", "k": "💬 نشاط جماعي", "t": "اطرح مجموعة أفكار لتوظيف أدوات التكنولوجيا الخضراء في الحفاظ على بيئة نظيفة، مستخدمًا أدوات البحث الرقمي.", "gold": false}, {"type": "act", "k": "🚀 أبدع / انطلق", "t": "أبدع: صمّم نموذجًا لفكرة جهاز استشعار يساهم في تنقية هواء حجرتك المنزلية أو ترشيد استهلاك الكهرباء في فصلك.", "gold": false}, {"type": "act", "k": "💡 هل تعلم؟", "t": "الاستدامة (Sustainability) تعني تلبية احتياجات اليوم <b>دون الإضرار بحق الأجيال القادمة</b> في الموارد والبيئة، وهي الفكرة التي تقوم عليها التكنولوجيا الخضراء.", "gold": true}], "pdf": "https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Prepratory/Prepratory1/Term1/StudentBook/ICT_ARABIC_Prp1_TR1.pdf", "key": "g1-l1", "say": "يلا نتعلم إزاي نحمي كوكبنا بالتكنولوجيا الخضراء 🌱", "root": "../../../"})</script></body></html>
