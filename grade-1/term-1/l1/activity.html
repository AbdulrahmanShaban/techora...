رياح."}, {"q": "الري بالتنقيط من أنظمة الري الموفرة للمياه.", "c": true, "why": "يوصل المياه بكميات محسوبة."}, {"q": "تُستخدم الحساسات في اكتشاف دخان الحرائق.", "c": true, "why": "من استخداماتها."}]}, {"type": "mcq", "title": "المستوى 2 • اختر الصحيح", "n": 8, "items": [{"q": "ما الفكرة الأساسية للتكنولوجيا الخضراء؟", "a": ["أدوات تقنية تحافظ على البيئة وترشّد استهلاك مواردها", "زيادة استهلاك الموارد", "تصنيع أجهزة أكثر", "الاعتماد على الوقود"], "c": 0, "why": "هذا تعريفها."}, {"q": "أي مما يلي من مصادر الطاقة المتجددة؟", "a": ["طاقة الشمس", "الفحم", "البنزين", "الغاز المحروق فقط"], "c": 0, "why": "الشمس مصدر متجدد."}, {"q": "ماذا تستخدم طاقة الرياح لتوليد الكهرباء؟", "a": ["توربينات الرياح", "السدود", "الألواح الشمسية", "الأسمدة"], "c": 0, "why": "تحوّل حركة الهواء لكهرباء."}, {"q": "كيف يساعد تحويل النفايات العضوية إلى سماد؟", "a": ["يحسّن خصوبة التربة", "يزيد التلوث", "يملأ الشوارع", "يلغي الزراعة"], "c": 0, "why": "سماد غني بالمغذيات."}, {"q": "ما فائدة السيارات الكهربائية؟", "a": ["تقليل ثاني أكسيد الكربون والتلوث", "زيادة العوادم", "زيادة استهلاك الوقود", "لا فائدة"], "c": 0, "why": "تقلل الانبعاثات."}, {"q": "كيف تساهم الحساسات في ترشيد الكهرباء؟", "a": ["تشغّل وتطفئ المصابيح وقت الحاجة فقط", "تترك المصابيح مضاءة", "تزيد شدة الإضاءة دائمًا", "تفصل الإنترنت"], "c": 0, "why": "تعمل عند الحاجة."}, {"q": "ما الذي تعتمد عليه المباني الخضراء؟", "a": ["مواد صديقة للبيئة وعزل وتهوية جيدة", "مواد عالية الاستهلاك", "عدم العزل", "الإضاءة المستمرة"], "c": 0, "why": "لتوفير الطاقة."}, {"q": "ما أثر زيادة ثاني أكسيد الكربون في الجو؟", "a": ["زيادة الاحتباس الحراري", "تنقية الهواء", "برودة الأرض", "لا أثر"], "c": 0, "why": "يحبس الحرارة."}]}, {"type": "match", "title": "المستوى 3 • اربط واكسب", "q": "اربط كل عنصر بما يناسبه", "rounds": [[["طاقة الشمس", "ألواح شمسية"], ["طاقة الرياح", "توربينات"], ["الطاقة المائية", "سدود"], ["الحرارية الأرضية", "حرارة باطن الأرض"], ["الطاقة الحيوية", "مواد عضوية كالذرة"]], [["إدارة النفايات", "إعادة التدوير"], ["معالجة المياه", "الري بالتنقيط"], ["المباني الخضراء", "عزل وتهوية وموارد صديقة"], ["النقل الذكي", "مركبات كهربائية"]]]}, {"type": "order", "title": "المستوى 4 • رتّب خطوات الحساس", "items": [{"q": "رتّب عمل صنبور المياه الذكي", "seq": ["اقتراب اليد من الصنبور", "الحساس يكتشف الجسم", "إرسال إشارة التشغيل", "تدفق المياه", "إبعاد اليد وإيقاف المياه"], "why": "اكتشاف ثم إشارة ثم تنفيذ ثم إيقاف."}]}, {"type": "mcq", "title": "المستوى 5 • 🔥 تحدي الخبراء", "n": 8, "items": [{"q": "مدرسة تريد تقليل استهلاك الكهرباء في الفصول الفارغة. أنسب حل؟", "a": ["حساسات حركة تطفئ الإضاءة عند عدم وجود أحد", "ترك الأضواء مضاءة", "زيادة المصابيح", "إلغاء الكهرباء"], "c": 0, "why": "تشغيل عند الحاجة."}, {"q": "أي مما يلي لا يُعد من أمثلة الطاقة المتجددة؟", "a": ["حرق الفحم والوقود الأحفوري", "الرياح", "الشمس", "المياه"], "c": 0, "why": "الوقود الأحفوري غير متجدد."}, {"q": "ما أفضل وصف للري بالتنقيط؟", "a": ["يوصل الماء للنبات بكميات محسوبة فيوفر المياه", "يغرق الأرض بالماء", "يعتمد على المطر فقط", "يزيد الهدر"], "c": 0, "why": "توفير وكفاءة."}, {"q": "تحويل بقايا الطعام إلى سماد يحقق أي هدف؟", "a": ["إدارة النفايات وتحسين التربة", "زيادة القمامة", "توليد الكهرباء من الرياح", "تلويث الماء"], "c": 0, "why": "تدوير عضوي."}, {"q": "أي ترتيب أفضل لتعاملك مع النفايات؟", "a": ["قلّل ثم أعد الاستخدام ثم دوّر", "دوّر ثم ألقِ", "ألقِ ثم قلّل", "احرق ثم دوّر"], "c": 0, "why": "الأفضل منع النفايات أولًا."}, {"q": "مبنى بعزل جيد وتهوية مدروسة ومواد صديقة يسمى:", "a": ["مبنى أخضر", "مبنى صناعي", "مبنى تجاري فقط", "مبنى مهجور"], "c": 0, "why": "المباني الخضراء."}, {"q": "أي حساس يناسب حماية منزل من الحرائق؟", "a": ["حساس الدخان", "حساس الصوت", "حساس الضوء فقط", "لوحة المفاتيح"], "c": 0, "why": "يكتشف الدخان مبكرًا."}, {"q": "لماذا يعمل نظام الطاقة الشمسية آليًا وقت الحاجة في الكتاب؟", "a": ["لأنه يحوّل الضوء إلى كهرباء ويُشغَّل تلقائيًا عند الحاجة", "لأنه يعمل بالوقود", "لأنه يحتاج تشغيلًا يدويًا دائمًا", "لأنه لا يعمل ليلًا فقط"], "c": 0, "why": "ألواح ضوئية + تشغيل آلي."}]}, {"type": "tf", "title": "المستوى 6 • 🔥 صح أم خطأ للخبراء", "items": [{"q": "الاستدامة تعني تلبية احتياجات اليوم دون الإضرار بحق الأجيال القادمة.", "c": true, "why": "هذا جوهرها."}, {"q": "الحساسات تحتاج دائمًا لتدخل بشري لكي تعمل.", "c": false, "why": "تعمل تلقائيًا."}, {"q": "التكنولوجيا الخضراء تعني الألواح الشمسية فقط.", "c": false, "why": "لها مجالات متعددة."}, {"q": "تقليل الهدر جزء من ترشيد الاستهلاك.", "c": true, "why": "ترشيد = استخدام بقدر الحاجة."}, {"q": "تحتاج السيارة الكهربائية إلى وقود تقليدي لتتحرك.", "c": false, "why": "تعمل بالبطاريات."}]}], "mount": "#game", "avatar": "../../../assets/teacher/g1-l1.jpg", "avatarFallback": "../../../assets/teacher/base.jpg"})</script></body></html>
