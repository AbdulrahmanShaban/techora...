احة."}, {"q": "عندما يكتشف نظام التشغيل جهازًا ملحقًا جديدًا يقوم بـ:", "a": ["تثبيت برنامج التشغيل Driver المناسب", "حذف الـ Driver", "إغلاق الجهاز", "إعادة تشغيله"], "c": 0, "why": "تثبيت تلقائي."}, {"q": "لتثبيت جهاز جديد ملحق يتطلب توفير:", "a": ["برامج التشغيل Drivers", "معلومات وبيانات", "صور", "مجلد"], "c": 0, "why": "الـ Driver ضروري."}, {"q": "أنظمة التشغيل الحديثة تتضمن قائمة من ______ للعديد من الأجهزة الملحقة.", "a": ["برامج التشغيل Drivers", "الفيروسات", "الأغاني", "البرامج الضارة"], "c": 0, "why": "قائمة Drivers."}, {"q": "خاصية التوصيل والتشغيل Plug and Play هي:", "a": ["قيام نظام التشغيل بتثبيت الـ Driver الصحيح للجهاز الملحق الجديد", "حذف الـ Driver", "نسخ الـ Driver", "إغلاق الجهاز"], "c": 0, "why": "تثبيت تلقائي."}]}, {"type": "tf", "title": "المستوى 2 • صح أم خطأ؟", "items": [{"q": "أثناء إعداد مشروعك يجب التأكد من وجود البرامج المطلوبة على الجهاز.", "c": true, "why": "صحيح."}, {"q": "تأتي العديد من البرامج مصحوبة بأمر إزالة خاص بها.", "c": true, "why": "صحيح."}, {"q": "يمكن إلغاء تثبيت البرنامج من لوحة التحكم Control Panel.", "c": true, "why": "صحيح."}, {"q": "يساعدك نظام التشغيل في إلغاء تثبيت البرنامج.", "c": true, "why": "صحيح."}, {"q": "إزالة البرامج غير المستخدمة تزيد من المساحة التخزينية المستخدمة.", "c": false, "why": "تقللها فتوفر مساحة."}, {"q": "تدعم نظم التشغيل أجهزة كثيرة ملحقة مثل الطابعة وكاميرا الويب.", "c": true, "why": "صحيح."}, {"q": "يكتشف نظام التشغيل الجهاز الملحق الجديد تلقائيًا ويثبّت الـ Driver المناسب.", "c": true, "why": "صحيح."}, {"q": "أنظمة التشغيل الحديثة لا تتضمن قائمة من الـ Drivers.", "c": false, "why": "تتضمن قائمة منها."}, {"q": "الـ Driver ملف يثبّته النظام لاستخدام الجهاز الجديد بمميزاته الكاملة.", "c": true, "why": "صحيح."}]}, {"type": "order", "title": "المستوى 3 • رتّب الخطوات", "items": [{"q": "رتّب خطوات تثبيت برنامج من ملف مضغوط", "seq": ["فك ضغط الملفات", "نقر مزدوج على ملف التثبيت", "اتباع تعليمات التثبيت"], "why": "فك الضغط أولًا ثم التثبيت."}, {"q": "رتّب خطوات إزالة برنامج من لوحة التحكم", "seq": [ ذف اليدوي ممنوع قانونًا", "لأنه لا فرق", "لأن المجلد لا يمكن حذفه أبدًا"], "c": 0, "why": "الإزالة الرسمية أكمل."}, {"q": "لماذا ننصح بتنزيل البرامج من مصادر رسمية؟", "a": ["لتجنب البرمجيات الضارة المقنّعة", "لأنها أسرع دائمًا", "لأنها أصغر حجمًا", "لأنها بلا Driver"], "c": 0, "why": "الأمان أولًا."}, {"q": "ما الذي يحدث عندما يجد Windows Driver مطابقًا للجهاز الجديد؟", "a": ["يثبّته ويجري التعديلات اللازمة دون تدخل منك", "يطلب منك كتابة كود", "يحذف الجهاز", "يغلق الجهاز"], "c": 0, "why": "تثبيت تلقائي."}]}, {"type": "tf", "title": "المستوى 6 • 🔥 صح أم خطأ للخبراء", "items": [{"q": "لا يمكن تغيير اسم الطابعة الافتراضي أثناء التثبيت.", "c": false, "why": "يمكن تغييره إلى اسم أكثر وصفًا."}, {"q": "إزالة البرامج غير المستخدمة تساعد على سرعة وسهولة استخدام الجهاز.", "c": true, "why": "من الملحوظة في الكتاب."}, {"q": "يمكن تثبيت برنامج مضغوط دون فك ضغطه أولًا.", "c": false, "why": "يجب فك الضغط أولًا."}, {"q": "الـ Driver يمكّن النظام من استخدام الجهاز بمميزاته الكاملة.", "c": true, "why": "صحيح."}]}], "mount": "#game", "avatar": "../../../assets/teacher/g1-l4.jpg", "avatarFallback": "../../../assets/teacher/base.jpg"})</script></body></html>
