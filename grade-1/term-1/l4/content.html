<!doctype html><html lang="ar" dir="rtl"><head><script src="../../../assets/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تثبيت وإزالة البرامج والأجهزة الرقمية الملحقة | Techora</title><link rel="icon" href="../../../assets/logo.svg"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="../../../firebase-config.js"></script><script src="../../../auth-core.js"></script><script src="../../../techora-config.js"></script><script src="../../../assets/data.js"></script><script src="../../../auth-guard.js" data-root="../../../"></script><link rel="stylesheet" href="../../../assets/lesson.css"></head><body><div class="top"><a href="../../../grade-1/term-1.html">→ دروس الفصل الأول</a><span class="t">الدرس الرابع • المحتوى</span><a href="../../../index.html">Techora ⌂</a></div><main class="wrap" id="app"></main><script src="../../../assets/lesson.js"></script><script>TLesson.render({"title": "تثبيت وإزالة البرامج والأجهزة الرقمية الملحقة", "pages": "ص ٢٧ – ٣٦", "unit": "الفصل الأول • البرامج والتطبيقات الرقمية", "intro": "محتاج برنامج جديد أو طابعة؟ اتعلّم تثبّت وتشيل البرامج وتوصّل الأجهزة الملحقة خطوة بخطوة.", "goals": ["أمارس خطوات تثبيت وإزالة برنامج على جهازي.", "أوصّل الأجهزة الملحقة (الطابعة) بالكمبيوتر الخاص بي.", "أشرح خطوات تنزيل الملفات (المضغوطة أو عبر الإنترنت) على جهازي."], "summary": "<b>تثبيت البرنامج</b> يتم من قرص (Run SETUP.EXE) أو من ملف منزّل أو مضغوط (فك الضغط ثم نقر مزدوج على ملف التثبيت). و<b>إزالته</b> من أمر الإزالة الخاص به أو من <b>لوحة التحكم</b> (Uninstall a program). والأجهزة الملحقة تحتاج <b>Driver</b> يثبّته النظام تلقائيًا مع خاصية <b>Plug and Play</b>، أو يدويًا عند الحاجة.", "sections": [{"type": "act", "k": "🗣️ لنتفاعل معًا", "t": "كيف يمكنك إضافة وتثبيت أو إزالة برنامج على جهاز الكمبيوتر الخاص بك أو هاتفك المحمول؟", "gold": false}, {"type": "text", "h": "١) تجهيز البرامج لمشروعك", "t": "أثناء إعداد مشروعك على الكمبيوتر أو الموبايل ستحتاج برامج كثيرة، ويجب التأكد من وجودها على الجهاز. فإذا لم يكن نظام التشغيل مزودًا بالبرنامج الذي تحتاجه، يمكنك الحصول عليه من <b>إحدى وحدات التخزين</b> أو من خلال <b>تنزيله عبر الإنترنت</b>، ثم <b>تثبيته</b> لاستخدامه."}, {"type": "cards", "items": [["💿", "برنامج مشترى", "يأتي على قرص مضغوط CD أو DVD، ونستخدمه لتثبيته."], ["⬇️", "برنامج منزّل من الإنترنت", "يكون على هيئة <b>ملف</b> نستخدمه لتثبيت البرنامج."]], "h": "كيف تبدأ عملية التثبيت؟ تعتمد على هيئة البرنامج"}, {"type": "acc", "h": "٢) طرق تثبيت البرنامج", "l": "اضغط على كل طريقة لتعرف الخطوات (تختلف خطوات التثبيت من برنامج لآخر):", "items": [["💿 أولًا: من قرص مضغوط أو DVD", "<div class=\"flow\"><div class=\"step\"><b>1</b><p>أدخل القرص في محرك الأقراص بالجهاز، فيظهر مربع حوار التشغيل التلقائي.</p></div><div class=\"step\"><b>2</b><p>انقر فوق <b>Run SETUP.EXE</b> (وهو عادةً اسم برنامج التثبيت).</p></div><div class=\"step\"><b>3</b><p>اتبع تعليمات التثبيت التي يوفرها البرنامج.</p></div></div>"], ["⬇️ ثانيًا: من ملف تم تنزيله من الإنترنت", "<div class=\"flow\"><div class=\"step\"><b>1</b><p>استخدم أيقونة <b>This PC</b> للوصول إلى الملف الذي تم تنزيله.</p></div><div class=\"step\"><b>2</b><p>انقر <b>نقرًا مزدوجًا</b> فوق الملف ليبدأ برنامج التثبيت.</p></div></div><div class=\"tip\" style=\"margin-top:10px\">انتبه: قد يكون الملف المنزَّل مضغوطًا، فعليك أولًا <b>فك الضغط</b> لتتعامل مع ملف SETUP.EXE.</div>"], ["🗜️ ثالثًا: من ملف مضغوط", "<div class=\"flow\"><div class=\"step\"><b>1</b><p>قم بفك ضغط الملفات.</p></div><div class=\"step\"><b>2</b><p>انقر نقرًا مزدوجًا فوق ملف التثبيت.</p></div><div class=\"step\"><b>3</b><p>اتبع تعليمات التثبيت التي يوفرها البرنامج.</p></div></div>"]]}, {"type": "text", "h": "٣) إزالة أو إلغاء تثبيت برنامج (Uninstall a Program)", "t": "عندما تخطط للتوقف عن استخدام برنامج مثبّت، يجب عليك <b>إلغاء تثبيته</b>، وهذا يعني <b>حذف كافة الملفات الخاصة بالبرنامج</b> من جهازك. وتؤدي إزالة البرامج غير المستخدمة إلى <b>توفير مساحة تخزينية</b> وسرعة وسهولة في استخدام الجهاز."}, {"type": "cards", "items": [["🧾", "بواسطة البرنامج نفسه", "تأتي كثير من البرامج مصحوبة بأمر إزالة أو إلغاء تثبيت خاص بها."], ["🎛️", "من لوحة التحكم Control Panel", "حيث يساعدك نظام التشغيل في إلغاء تثبيت البرنامج."]], "h": "طريقتان لإزالة البرنامج"}, {"type": "steps", "h": "خطوات إزالة برنامج من لوحة التحكم", "items": [["١", "افتح نافذة لوحة التحكم <b>Control Panel</b>."], ["٢", "انقر فوق <b>Uninstall a program</b> فتظهر نافذة البرامج المثبتة."], ["٣", "انقر فوق البرنامج الذي تريد إلغاء تثبيته ثم انقر <b>Uninstall</b>."]]}, {"type": "act", "k": "📓 كراسة الأنشطة", "t": "لمزيد من الأنشطة والتدريبات ارجع إلى كراسة الأنشطة (نشاط رقم 1–2–3–4).", "gold": false}, {"type": "text", "h": "٤) إعداد وتثبيت الأجهزة (Hardware)", "t": "تدعم نظم التشغيل أجهزة كثيرة ملحقة بالكمبيوتر مثل <b>الطابعة وكاميرا الويب والماسح الضوئي</b>. ويكتشف نظام التشغيل الجهاز الملحق الجديد <b>تلقائيًا</b>، ويثبّت له <b>برنامج التشغيل (Driver)</b> الصحيح ليتمكن المستخدم من استخدام الجهاز بمميزاته الكاملة."}, {"type": "cards", "items": [["🧩", "برنامج التشغيل Driver", "ملف أو ملفات يثبّتها نظام التشغيل ليتعرف على الجهاز الملحق الجديد ويستخدمه بمميزاته الكاملة."], ["💿", "قرص الإعداد", "تتضمن الأجهزة الجديدة غالبًا قرصًا فيه الـ Drivers وبرامج الأدوات المساعدة، ويقوم برنامج الإعداد Setup بنسخ ملف Driver وملف معلومات الإعداد (.inf) في مجلد مخصص تلقائيًا."]], "h": "ما هو الـ Driver؟"}, {"type": "acc", "h": "تثبيت جهاز له خاصية التوصيل والتشغيل (Plug and Play)", "items": [["✅ عندما يتضمن النظام Driver مطابقًا", "أنظمة التشغيل الحديثة تتضمن قائمة من الـ Drivers لأجهزة كثيرة. وعند توصيل جهاز جديد لأول مرة يكتشفه النظام ويبحث في قائمته عن Driver مناسب، فإذا وجده <b>ثبّته وأجرى التعديلات اللازمة دون تدخل منك</b>، وتظهر رسالة بتعريف الجهاز ثم رسالة نجاح التثبيت."], ["⚠️ عندما لا يتضمن النظام Driver مطابقًا", "عند توصيل الجهاز (مثلًا بمنفذ USB) ولا يتمكن النظام من تحديد Driver مناسب، يشغّل <b>برنامج المعالج</b> للعثور عليه، ويمكنك تحديد مكان الـ Driver سواء كان على قرص CD أو أي وحدة تخزين أخرى."]]}, {"type": "acc", "h": "٥) تثبيت الطابعة", "items": [["🖨️ طابعة محلية تدعم Plug and Play", "طابعة متصلة مباشرة بالكمبيوتر: يتم توصيلها بمنفذ <b>USB</b> وستقوم خاصية التوصيل والتشغيل بالتثبيت تلقائيًا."], ["🛠️ طابعة لا تدعم Plug and Play", "تتطلب بعض الإعدادات الإضافية:<div class=\"flow\"><div class=\"step\"><b>1</b><p>افتح لوحة التحكم واختر <b>Hardware and Sound</b> ثم <b>Devices and Printers</b>.</p></div><div class=\"step\"><b>2</b><p>انقر <b>Add a printer</b>.</p></div><div class=\"step\"><b>3</b><p>اضغط <b>The printer that I want isn't listed</b> ثم اختر <b>Add a local printer or network printer with manual settings</b>.</p></div><div class=\"step\"><b>4</b><p>حدّد <b>المنفذ</b>: LPT1 (المنفذ المتوازي) للطابعات القديمة، أما الحديثة فتستخدم USB.</p></div><div class=\"step\"><b>5</b><p>انقر <b>Next</b> واختر Driver الصحيح من قائمة الشركة المصنعة ونوع الطابعة (مثل HP LaserJet 5200 Series PCL 5).</p></div><div class=\"step\"><b>6</b><p>إن لم تجد الـ Driver: انقر <b>Have Disk</b> واستعرض وحدات التخزين، أو <b>Windows Update</b> لتحديث القائمة.</p></div><div class=\"step\"><b>7</b><p>أعطِ الطابعة اسمًا (الافتراضي اسم الشركة والطراز ويمكن تغييره)، ثم اطبع <b>صفحة اختبار</b> للتأكد من عملها.</p></div></div>"], ["📦 إذا كانت حزمة الـ Driver تتضمن برنامج إعداد", "قم بتشغيل <b>برنامج الإعداد</b> ومن خلاله يمكنك تعريف الطابعة داخل نظام التشغيل."]]}, {"type": "cards", "items": [["🔒", "حمّل من مصادر رسمية", "البرامج المقرصنة أو من مواقع مجهولة قد تحتوي برمجيات ضارة."], ["📱", "على الموبايل", "نثبت التطبيقات من المتجر الرسمي، ونحذفها من الإعدادات أو بالضغط المطول على أيقونة التطبيق."], ["🔄", "حدّث الـ Drivers", "التحديث يحسّن عمل الأجهزة ويصلح مشكلات التوافق."]], "h": "نصائح إضافية (من خارج الكتاب)"}, {"type": "act", "k": "🖨️ نشاط تطبيقي", "t": "اطبع صفحة اختبار بعد تثبيت الطابعة، وسجّل ما لاحظته. ثم لمزيد من الأنشطة ارجع إلى كراسة الأنشطة (نشاط رقم 5–6).", "gold": false}, {"type": "act", "k": "💡 هل تعلم؟", "t": "عند إلغاء تثبيت البرنامج من لوحة التحكم يزيل نظام التشغيل ملفات البرنامج وإعداداته المسجلة، لذلك لا يُنصح بحذف مجلد البرنامج يدويًا فقط.", "gold": true}], "pdf": "https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Prepratory/Prepratory1/Term1/StudentBook/ICT_ARABIC_Prp1_TR1.pdf", "key": "g1-l4", "say": "ثبّت وشيل البرامج ووصّل الطابعة بسهولة.. تعال أوريك الخطوات 💿🖨️", "root": "../../../"})</script></body></html>
