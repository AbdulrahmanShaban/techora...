 (مايكروسوفت)."}, {"type": "text", "h": "حساب جوجل Google Account", "t": "يقدم Google خدمات إلكترونية كثيرة منها Gmail. ولإنشاء بريد والحصول على الخدمات الأخرى يجب إنشاء <b>حساب جوجل</b> ويتكون من <b>اسم المستخدم</b> و<b>كلمة المرور</b>. ومن مميزاته أنه يتيح لك التسجيل في Gmail واستخدام خدمات أخرى مثل <b>YouTube وGoogle Drive وGoogle Docs وGoogle Meet</b>."}, {"type": "steps", "h": "٦) خطوات إنشاء حساب جوجل", "items": [["١", "افتح موقع جوجل <span dir=\"ltr\">https://www.google.com.eg</span>."], ["٢", "اضغط تسجيل الدخول <b>Sign in</b>."], ["٣", "اضغط إنشاء حساب <b>Create Account</b>."], ["٤", "اختر <b>إنشاء حسابي الشخصي</b> (For my personal use)."], ["٥", "أدخل اسمك الأول First Name واسمك الأخير Last Name ثم التالي."], ["٦", "أدخل تاريخ ميلادك والنوع ثم التالي."], ["٧", "اكتب اسم المستخدم Username الذي ترغب به ثم التالي."], ["٨", "اختر كلمة مرور <b>يصعب تخمينها</b> وأكّدها مرة أخرى."], ["٩", "أدخل بريدًا بديلًا Alternate email لاسترداد الحساب (ويمكن تخطيه)."], ["١٠", "اطّلع على عنوان بريدك وتأكد منه."], ["١١", "اطّلع على بنود الخدمة واضغط <b>أوافق</b> إن قبلتها."], ["١٢", "أصبح لديك <b>Google Account</b> (اسم مستخدم + كلمة مرور) للدخول إلى بريدك وخدمات جوجل."]]}, {"type": "cards", "h": "٧) واجهة Gmail", "items": [["🌐", "تغيير لغة الواجهة", "أيقونة الإعدادات ثم <b>See all settings</b> ثم من General اختر Gmail display language وحدد العربية، ثم <b>Save Changes</b>."], ["🚪", "الخروج من حسابك", "انقر على صورة ملفك الشخصي ثم اختر <b>تسجيل خروج Sign out</b>."]]}, {"type": "acc", "h": "نصائح أمان (معلومات إضافية)", "items": [["🔐 كلمة مرور قوية", "طويلة (12 حرفًا فأكثر)، تجمع حروفًا وأرقامًا ورموزًا، ولا تتضمن اسمك أو تاريخ ميلادك، ولا تُستخدم في أكثر من موقع."], ["✅ التحقق بخطوتين", "يضيف طبقة حماية: بعد كلمة المرور يطلب رمزًا يصل لهاتفك."], ["🎣 تعامل بحذر مع الرسائل", "لا تفتح مرفقًا أو رابطًا من مرسل غير معروف، ولا تعطِ كلمة مرورك لأحد حتى لو ادّعى أنه من جوجل."], ["✍️ اسم بريد محترم", "اختر اسمًا يناسب دراستك وعملك المستقبلي بدل الأسماء المضحكة أو الغريبة."]]}, {"type": "act", "k": "📧 نشاط تطبيقي", "t": "أنشئ بريدك الإلكتروني (بإشراف معلمك وولي أمرك)، وأرسل رسالة لمعلمك تتضمن اسمك وفصلك. ثم لمزيد من الأنشطة ارجع لكراسة الأنشطة (نشاط 1–2).", "gold": false}, {"type": "act", "k": "💡 هل تعلم؟", "t": "البريد الإلكتروني ليس مجرد رسائل: هو مفتاح التسجيل في معظم المواقع والخدمات الرقمية، ولهذا يجب حمايته بكلمة مرور قوية.", "gold": true}], "pdf": "https://elearnningcontent.blob.core.windows.net/elearnningcontent/2026_2027/Prepratory/Prepratory1/Term1/StudentBook/ICT_ARABIC_Prp1_TR1.pdf", "key": "g1-l5", "say": "البريد الإلكتروني هو بطاقتك الرقمية.. خلّيه آمن 📧🔐", "root": "../../../"})</script></body></html>
