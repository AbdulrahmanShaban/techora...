": ["Gmail خدمة بريد ضمن خدمات حساب جوجل", "هما كلمتان لنفس البرنامج دائمًا", "Gmail نظام تشغيل", "حساب جوجل برنامج رسم"], "c": 0, "why": "حساب واحد لعدة خدمات."}]}, {"type": "tf", "title": "المستوى 6 • 🔥 صح أم خطأ للخبراء", "items": [{"q": "يمكن استخدام نفس كلمة المرور في كل المواقع دون أي خطر.", "c": false, "why": "اختراق موقع واحد يعرّض باقي الحسابات."}, {"q": "قد يصل البريد الإلكتروني إلى المستلم حتى لو كان غير متصل بالإنترنت وقت الإرسال.", "c": true, "why": "اتصال غير مباشر."}, {"q": "الرسائل المزعجة Spam قد تحتوي على روابط احتيالية.", "c": true, "why": "لذلك لا نفتحها."}, {"q": "الخطوة الوحيدة لحماية الحساب هي إخفاء اسم المستخدم.", "c": false, "why": "كلمة المرور والتحقق وحذر الرسائل أهم."}]}], "mount": "#game", "avatar": "../../../assets/teacher/g1-l5.jpg", "avatarFallback": "../../../assets/teacher/base.jpg"})</script></body></html>
